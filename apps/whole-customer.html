<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Whole Customer — pipeline × receivables</title>
  <script type="application/embabel-app+json">
  {
    "version": 1,
    "description": "Pipeline and receivables per customer, over live Odoo through realm-odoo — with an AI read grounded on the rows shown.",
    "dependsOn": {
      "views": ["OdooPipelineReceivables"],
      "realms": ["odoo"],
      "gateway": ["ai", "kg"]
    }
  }
  </script>
  <link rel="stylesheet" href="whole-customer.css">
  <script src="/api/v1/apps-runtime/v1/embabel.js"></script>
  <script src="/api/v1/apps-runtime/gateway.js"></script>
</head>
<body>
  <header class="o_nav">
    <span class="o_brand">The Whole Customer</span>
    <span class="o_crumb">CRM × Invoicing — the screen with both eyes open</span>
    <label class="o_stage">Stage
      <select id="stage">
        <option>New</option><option>Qualified</option>
        <option selected>Proposition</option><option>Won</option>
      </select>
    </label>
  </header>

  <section class="o_ask">
    <input id="ask" placeholder="Ask across modules — e.g. which customers owe us the most while we chase new deals?">
    <button id="askBtn" class="o_btn o_btn_primary">Ask</button>
    <div id="askOut" class="o_askout" hidden></div>
  </section>

  <main id="cards" class="o_kanban" aria-live="polite">
    <div class="o_empty">Loading live Odoo data…</div>
  </main>

  <footer class="o_foot">
    Every figure fetched at load through realm-odoo's producers — Odoo's own API, its record
    rules intact. Nothing mirrored, nothing invented; AI reads are labelled and grounded on the
    rows above them.
  </footer>
  <script src="whole-customer.js"></script>
</body>
</html>
