# The AI layer over the pipeline: Cypher reads, the model judges. Sentiment comes from the
# deal's own chatter (what the participants actually wrote), the triage from size, odds,
# firmographics and that sentiment together. The judgments live HERE, in a lens, because a
# generated Cypher query cannot make them and a view must stay deterministic — the battery
# reconciles views to the cent, and a model's opinion has no cents.
id: deal-triage
name: Deal Triage
description: >-
  Classify every open opportunity — strategic / standard / at-risk — and read the sentiment
  of its recent interactions from the chatter thread. Answers "which deals are in trouble",
  "how do our opportunities feel", "triage the pipeline".
spec:
  kind: cypherscript
  script: |
    const parse = (r) => (r && r.rows) ? r.rows : (r || []);
    const pipe = parse(await gateway.kg.query({
      cypher: `MATCH (b:OdooBook)-[:HAS_OPEN_LEAD]->(l:OdooLead)-[:LEAD_OF]->(c:OdooCustomer)
               RETURN l.id AS leadId, l.name AS deal, c.id AS customerId, c.name AS customer,
                      l.expected_revenue AS revenue, l.probability AS probability LIMIT 100`,
      params: JSON.stringify({}),
    }));
    const msgs = parse(await gateway.kg.query({
      cypher: `MATCH (b:OdooBook)-[:HAS_OPEN_LEAD]->(l:OdooLead)-[:HAS_MESSAGE]->(m:OdooMessage)
               RETURN l.id AS leadId, m.body AS body, m.date AS date LIMIT 400`,
      params: JSON.stringify({}),
    }));
    const firmo = parse(await gateway.kg.query({
      cypher: `MATCH (b:OdooBook)-[:HAS_CUSTOMER]->(c:OdooCustomer)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)
               RETURN c.id AS customerId, toInteger(d.nbEmployees) AS headcount, d.industries AS industries LIMIT 100`,
      params: JSON.stringify({}),
    }));

    /* Odoo stores chatter as HTML; the judge gets text. */
    const text = (h) => String(h || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
    const byLead = {};
    for (const m of msgs) (byLead[m.leadId] = byLead[m.leadId] || []).push(text(m.body));
    const byCustomer = {};
    for (const f of firmo) byCustomer[f.customerId] = f;

    /* Sentiment — judged ONLY for deals that have interactions; silence is not neutral, it is unknown. */
    const talked = pipe.filter((d) => (byLead[d.leadId] || []).length > 0);
    const sentiments = talked.length ? await gateway.ai.classify({
      instruction: "Each item is the recent chatter on one sales opportunity, newest context last. Judge the customer's current disposition toward the deal from what was actually written.",
      items: talked.map((d) => byLead[d.leadId].slice(0, 6).join(" | ")),
      categories: "positive,neutral,negative",
      role: "best",
    }) : [];
    const sentimentByLead = {};
    talked.forEach((d, i) => { sentimentByLead[d.leadId] = sentiments[i] ? sentiments[i].category : null; });

    /* Triage — every open deal, judged on size, odds, who the customer really is, and the thread. */
    const digest = (d) => {
      const f = byCustomer[d.customerId];
      return `${d.deal} — ${d.customer}${f ? ` (${f.headcount} employees, ${(f.industries || []).slice(0, 2).join("/")})` : ""}, ` +
        `$${d.revenue} at ${d.probability}% | sentiment: ${sentimentByLead[d.leadId] || "no recent interactions"}` +
        ((byLead[d.leadId] || []).length ? ` | thread: ${byLead[d.leadId].slice(0, 4).join(" | ").slice(0, 500)}` : "");
    };
    const triage = pipe.length ? await gateway.ai.classify({
      instruction: "Each item is one open sales opportunity. strategic: large value or a major company, worth leadership attention. at_risk: the interactions or odds say it is stalling or souring, whatever its size. standard: everything else.",
      items: pipe.map(digest),
      categories: "strategic,standard,at_risk",
      role: "best",
    }) : [];

    const rows = pipe.map((d, i) => ({
      leadId: d.leadId, deal: d.deal, customerId: d.customerId, customer: d.customer,
      revenue: Number(d.revenue), probability: Number(d.probability),
      headcount: byCustomer[d.customerId] ? byCustomer[d.customerId].headcount : null,
      sentiment: sentimentByLead[d.leadId] || null,
      triage: triage[i] ? triage[i].category : null,
    })).sort((a, b) => (b.triage === "at_risk") - (a.triage === "at_risk") || b.revenue - a.revenue);
    await gateway.lens.present({ content: JSON.stringify({ kind: "deal-triage", rows }) });
