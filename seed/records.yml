# Demo seed for realm-odoo — fictional relationships, real entities (see the realm
# spec's seed/ section). None of these companies is a customer and none owes anyone
# anything; their DOMAINS are real, which is what the enrichment joins key on. The
# shipped fictional customers (Acme, Azure Interior, ...) stay untouched as the
# honest contrast: a placeholder domain resolves to nothing, and should.
#
# Bunnings is here deliberately: it is owned by Wesfarmers, so the parent-chain
# walk has a real edge to find.
customers:
  - name: Atlassian
    website: https://www.atlassian.com
    invoices:
      - { ref: SEED-ATL-1, amount: 84000, description: "Platform advisory retainer" }
    opportunities:
      - name: "SEED Team workflow rollout"
        expected_revenue: 120000
        probability: 65
        stage: Proposition
        # Chatter with a deliberate negative arc, so sentiment judgment has a real signal.
        notes:
          - "Call with procurement: pricing pushback on the rollout tier. They want 20% off or they pause."
          - "Legal review stuck for three weeks now. Champion has stopped replying to email."
  - name: Canva
    website: https://www.canva.com
    invoices:
      - { ref: SEED-CNV-1, amount: 36500, description: "Design systems audit" }
  - name: Qantas
    website: https://www.qantas.com
    invoices:
      - { ref: SEED-QF-1, amount: 40000, description: "Loyalty analytics engagement" }
      - { ref: SEED-QF-2, amount: 12750, description: "Follow-on workshop" }
    opportunities:
      - name: "SEED Fleet data platform"
        expected_revenue: 250000
        probability: 30
        stage: Qualified
        # Positive arc — the counterweight the classifier should separate from Atlassian's.
        notes:
          - "Great workshop with the ops team — they want to expand scope to include loyalty data."
          - "CTO confirmed budget approved for phase one. Asked us to send the SOW this week."
  - name: Bunnings
    website: https://www.bunnings.com.au
    invoices:
      - { ref: SEED-BUN-1, amount: 22000, description: "Store network pilot" }

# Meetings, so preparation has something to prepare for. Times are seeded relative to the
# day the seed runs (start_in_days at 10:00 UTC, one hour long) — a demo seeded once and
# opened a month later would otherwise be preparing for the past.
meetings:
  - name: "Qantas quarterly review"
    customer: Qantas
    start_in_days: 1
  - name: "Atlassian rollout check-in"
    customer: Atlassian
    start_in_days: 2
