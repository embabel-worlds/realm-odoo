name: odoo
description: "Odoo Community over its OWN middle tier — the JSON-2 API, never the database. Types for the stable core CRM/sales/invoicing models with declared virtual joins (the ORM states its relations; nothing here is guessed), producers with domain pushdown, and a bundled skill that teaches a coding agent to extend the realm for a customer's custom modules by reading fields_get through this same API."
