# The natural-language battery — the questions a person will actually type, generated from the
# realm's shape (counts, superlatives, statuses, windows, synonyms) and extended by USERS with
# every question that ever disappointed them. Each is a permanent regression test; the runner
# is tests/verify.sh. Money and count questions assert matchesView: the NL answer must equal
# the curated view's figure — reconciliation without literals to rot.

- question: "How many customers do we have"
  expect: { matchesView: { name: OdooCustomerCount, column: customers } }
- question: "Which customers owe us most money"
  expect: { matchesView: { name: OdooReceivablesByCustomer, column: totalOwed } }
- question: "which is our most valuable customer"
  expect: { matchesView: { name: OdooReceivablesByCustomer, column: totalOwed } }
- question: "total outstanding receivables per client"
  expect: { matchesView: { name: OdooReceivablesByCustomer, column: totalOwed } }
- question: "what is our biggest win"
  expect: { matchesView: { name: OdooWins, column: value } }
# The demo's wins all close on install day (today), so LAST quarter is honestly empty —
# demanding rows here failed the harness the moment the selector learned to bind calendar
# quarters precisely. THIS quarter contains them, and reconciles against the all-time view
# top because the demo has no earlier wins to differ by.
- question: "what was our biggest win this quarter"
  expect: { matchesView: { name: OdooWins, column: value } }
- question: "what was our biggest win of the last quarter"
  expect: { minRows: 0 }   # honest empty; asserts the ask runs without error
- question: "what deals have we won"
  expect: { nonEmpty: true }
- question: "show me our open opportunities"
  expect: { nonEmpty: true }
- question: "what is our biggest open opportunity"
  expect: { matchesView: { name: OdooOpenPipeline, column: expectedRevenue } }
- question: "who still hasn't paid us"
  expect: { nonEmpty: true }
- question: "how many unpaid invoices are there"
  expect: { nonEmpty: true }
- question: "which opportunities are at the Proposition stage"
  expect: { nonEmpty: true }
- question: "what are the 10 biggest outstanding invoices"
  expect: { matchesView: { name: OdooOutstandingInvoices, column: owed } }
- question: "largest unpaid invoices"
  expect: { matchesView: { name: OdooOutstandingInvoices, column: owed } }
- question: "what are our 10 biggest opportunities over 60%"
  expect: { matchesView: { name: OdooOpenPipeline, column: expectedRevenue, args: { minProbability: 60 } } }

# ── Diffbot enrichment questions — the cross-source layer. These need realm-diffbot and a
# customer whose website Diffbot recognizes; where enrichment is honestly null the figure
# questions still reconcile because the view and the ask see the same nulls.
- question: "how big are our customers"
  expect: { matchesView: { name: OdooCustomerFirmographics, column: headcount } }
- question: "which of our customers is the biggest company"
  expect: { matchesView: { name: OdooCustomerFirmographics, column: headcount } }
- question: "what industries do we sell into"
  expect: { nonEmpty: true }
- question: "which open deals are at the biggest companies"
  expect: { nonEmpty: true }
- question: "who ultimately owns the companies that owe us money"
  expect: { matchesView: { name: OdooDebtorOwnership, column: totalOwed } }
# News is volatile by nature — the assertion is attribution and presence, not a figure.
- question: "what's in the news about the companies that owe us money"
  expect: { nonEmpty: true }
# Judgment questions route to the deal-triage LENS (model judgment; no single query exists) —
# the selector must hand them over rather than guessing a numeric proxy for "risk".
- question: "which of our deals are at risk"
  expect: { nonEmpty: true }
- question: "how do our open opportunities feel"
  expect: { nonEmpty: true }
# Meeting prep is a VIEW (OdooMeetingBriefing) — virtual cypher end to end, synthesize()
# composing the prose in-query — so the money beside the prose reconciles like any figure.
- question: "prep me for my meeting with Qantas"
  expect: { matchesView: { name: OdooMeetingBriefing, column: owed, args: { customer: "Qantas" } } }
