# A disposable Odoo 19 Community for this realm to be proved against — CRM, sales and
# invoicing with Odoo's own demo data, and an API key minted on first boot so nothing
# here needs a browser. Stands alone (`docker compose up -d` in this directory) or is
# pulled into a larger stack by `include:`; service and volume names are prefixed so the
# merge cannot collide.
#
# Order is declared, not remembered: database -> init (creates the database, installs
# the modules, mints the key, exits) -> server.
#
# The key lands in the `odoo-state` volume as /state/odoo.env. Nothing here is a secret
# worth keeping: the instance is a demo and its data is fiction.

services:
  odoo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  odoo-init:
    image: odoo:19
    user: root
    depends_on:
      odoo-db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/stack/init.sh"]
    environment:
      PGHOST: odoo-db
      PGUSER: odoo
      PGPASSWORD: odoo
      ODOO_DEMO_DATA: ${ODOO_DEMO_DATA:-true}
    volumes:
      - ./init.sh:/stack/init.sh:ro
      - odoo-data:/var/lib/odoo
      - odoo-state:/state
    restart: "no"

  odoo:
    image: odoo:19
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    command: ["odoo", "-d", "odoo", "--db-filter=^odoo$$"]
    ports:
      - "${ODOO_PORT:-8069}:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  odoo-db:
  odoo-data:
  odoo-state:
