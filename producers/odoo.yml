    phone: "CASE r.phone WHEN false THEN null ELSE r.phone END"
    city: "CASE r.city WHEN false THEN null ELSE r.city END"
    country_id: "CASE r.country_id WHEN false THEN null ELSE r.country_id[0] END"
    country: "CASE r.country_id WHEN false THEN null ELSE r.country_id[1] END"
    website: "CASE r.website WHEN false THEN null ELSE r.website END"
    industry_id: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[0] END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    industry: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[1] END"
    ownerName: "CASE r.user_id WHEN false THEN null ELSE r.user_id[1] END"
    relationship: "CASE WHEN r.customer_rank > 0 THEN 'customer' WHEN r.supplier_rank > 0 THEN 'other' ELSE 'prospect' END"
    sourceUrl: "'http://localhost:8069/odoo/res.partner/' + toString(r.id)"
    parent_id: "CASE r.parent_id WHEN false THEN null ELSE r.parent_id[0] END"
    parentCompanyId: "CASE r.parent_id WHEN false THEN null ELSE (CASE WHEN toString(r.is_company) = 'true' THEN r.parent_id[0] ELSE null END) END"
    commercialPartnerId: "CASE r.commercial_partner_id WHEN false THEN null ELSE r.commercial_partner_id[0] END"
  # Same door, same fields as customersAll — so the same rules, for the same reasons. This is
  # the door a single company is read through: `c.name = 'Qantas'` is one call.
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: email, op: EQUALS, argPath: "domain.-", clause: ["email", "=", "{value}"] }
    - { property: email, op: CONTAINS, argPath: "domain.-", clause: ["email", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: email, op: IN, argPath: "domain.-", clause: ["email", "in", "{values}"] }
    - { property: city, op: EQUALS, argPath: "domain.-", clause: ["city", "=", "{value}"] }
    - { property: city, op: CONTAINS, argPath: "domain.-", clause: ["city", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: website, op: EQUALS, argPath: "domain.-", clause: ["website", "=", "{value}"] }
    - { property: website, op: CONTAINS, argPath: "domain.-", clause: ["website", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: phone, op: EQUALS, argPath: "domain.-", clause: ["phone", "=", "{value}"] }
    - { property: is_company, op: EQUALS, argPath: "domain.-", clause: ["is_company", "=", "{value}"] }
    - { property: country_id, op: EQUALS, argPath: "domain.-", clause: ["country_id", "=", "{value}"] }
    - { property: country_id, op: IN, argPath: "domain.-", clause: ["country_id", "in", "{values}"] }
    - { property: country, op: EQUALS, argPath: "domain.-", clause: ["country_id.name", "=", "{value}"] }
    - { property: industry_id, op: EQUALS, argPath: "domain.-", clause: ["industry_id", "=", "{value}"] }
    - { property: industry_id, op: IN, argPath: "domain.-", clause: ["industry_id", "in", "{values}"] }
    - { property: industry, op: EQUALS, argPath: "domain.-", clause: ["industry_id.name", "=", "{value}"] }
    - { property: user_id, op: EQUALS, argPath: "domain.-", clause: ["user_id", "=", "{value}"] }
    - { property: user_id, op: IN, argPath: "domain.-", clause: ["user_id", "in", "{values}"] }
    - { property: ownerName, op: EQUALS, argPath: "domain.-", clause: ["user_id.name", "=", "{value}"] }
    - { property: parent_id, op: EQUALS, argPath: "domain.-", clause: ["parent_id", "=", "{value}"] }
    - { property: parent_id, op: IN, argPath: "domain.-", clause: ["parent_id", "in", "{values}"] }
    - { property: relationship, op: EQUALS, argPath: "domain.-", clause: ["customer_rank", ">", 0], valuePattern: '^(customer)$' }
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  # HOW MANY COMPANIES: one search_count over the door's own domain, not a walk of the book.
  # Exact under the same rules as customersAll's count.
  aggregates:
    - measure: count
      operation: partnersSearchCount
      args:
        domain:
          - ["is_company", "=", true]
      valueField: "$"
      keyField: scopeKey
  cache: { kind: ttl, seconds: 900, negativeTtlSeconds: 900 }

# ── Back from the ACCOUNT. The business vocabulary's CustomerAccount is a spine several systems
# key; these lead from it to what Odoo holds, so a question that starts at an account — asked
# by a realm that has never heard of Odoo — reaches the deals, the people and the notes.

# Odoo's record of an account, by the company's domain. `ilike` is a SUBSTRING match, so this
# does not echo the asked key: the join matches each record's own `website` through the spine.
# One call per account — `ilike` takes no list — which is why TRACKED_AS rides the company sweep
# whenever a query has one (`ridesHub`).
- name: customersByWebsite
  kind: api
  operation: partnersSearchRead
  records: "$[*]"
  # String mode: `ilike` wants a string, and list mode would hand it ["stark.com"].
  keyTemplate: "{key}"
  batchSafe: false
  args:
    domain:
      - ["website", "ilike", "{keys}"]
      # Companies only: a contact inherits nothing here, but one may carry the same website.
      - ["is_company", "=", true]
    fields: [name, email, phone, city, country_id, is_company, website, parent_id, commercial_partner_id, industry_id, user_id, customer_rank, supplier_rank]
    # No `load: ""` here, unlike every other door: see THE PARTNER DOORS at the top.
    limit: 20
  compute:
    email: "CASE r.email WHEN false THEN null ELSE r.email END"
    phone: "CASE r.phone WHEN false THEN null ELSE r.phone END"
    city: "CASE r.city WHEN false THEN null ELSE r.city END"
    country_id: "CASE r.country_id WHEN false THEN null ELSE r.country_id[0] END"
    country: "CASE r.country_id WHEN false THEN null ELSE r.country_id[1] END"
    website: "CASE r.website WHEN false THEN null ELSE r.website END"
    industry_id: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[0] END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    industry: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[1] END"
    ownerName: "CASE r.user_id WHEN false THEN null ELSE r.user_id[1] END"
    relationship: "CASE WHEN r.customer_rank > 0 THEN 'customer' WHEN r.supplier_rank > 0 THEN 'other' ELSE 'prospect' END"
    sourceUrl: "'http://localhost:8069/odoo/res.partner/' + toString(r.id)"
    parent_id: "CASE r.parent_id WHEN false THEN null ELSE r.parent_id[0] END"
    parentCompanyId: "CASE r.parent_id WHEN false THEN null ELSE (CASE WHEN toString(r.is_company) = 'true' THEN r.parent_id[0] ELSE null END) END"
    commercialPartnerId: "CASE r.commercial_partner_id WHEN false THEN null ELSE r.commercial_partner_id[0] END"
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: email, op: EQUALS, argPath: "domain.-", clause: ["email", "=", "{value}"] }
    - { property: email, op: CONTAINS, argPath: "domain.-", clause: ["email", "ilike", "{value}"], match: ci }
    - { property: email, op: IN, argPath: "domain.-", clause: ["email", "in", "{values}"] }
    - { property: city, op: EQUALS, argPath: "domain.-", clause: ["city", "=", "{value}"] }
    - { property: city, op: CONTAINS, argPath: "domain.-", clause: ["city", "ilike", "{value}"], match: ci }
    - { property: website, op: EQUALS, argPath: "domain.-", clause: ["website", "=", "{value}"] }
    - { property: website, op: CONTAINS, argPath: "domain.-", clause: ["website", "ilike", "{value}"], match: ci }
    - { property: phone, op: EQUALS, argPath: "domain.-", clause: ["phone", "=", "{value}"] }
    - { property: is_company, op: EQUALS, argPath: "domain.-", clause: ["is_company", "=", "{value}"] }
    - { property: country_id, op: EQUALS, argPath: "domain.-", clause: ["country_id", "=", "{value}"] }
    - { property: country_id, op: IN, argPath: "domain.-", clause: ["country_id", "in", "{values}"] }
    - { property: country, op: EQUALS, argPath: "domain.-", clause: ["country_id.name", "=", "{value}"] }
    - { property: industry_id, op: EQUALS, argPath: "domain.-", clause: ["industry_id", "=", "{value}"] }
    - { property: industry_id, op: IN, argPath: "domain.-", clause: ["industry_id", "in", "{values}"] }
    - { property: industry, op: EQUALS, argPath: "domain.-", clause: ["industry_id.name", "=", "{value}"] }
    - { property: user_id, op: EQUALS, argPath: "domain.-", clause: ["user_id", "=", "{value}"] }
    - { property: user_id, op: IN, argPath: "domain.-", clause: ["user_id", "in", "{values}"] }
    - { property: ownerName, op: EQUALS, argPath: "domain.-", clause: ["user_id.name", "=", "{value}"] }
    - { property: parent_id, op: EQUALS, argPath: "domain.-", clause: ["parent_id", "=", "{value}"] }
    - { property: parent_id, op: IN, argPath: "domain.-", clause: ["parent_id", "in", "{values}"] }
    - { property: relationship, op: EQUALS, argPath: "domain.-", clause: ["customer_rank", ">", 0], valuePattern: '^(customer)$' }
  # An account billing knows and the CRM does not is asked about on every query otherwise.
  cache: { kind: ttl, seconds: 900, negativeTtlSeconds: 900 }

# Every opportunity with a customer. The leading clause is the key; the OR after it asks for
# archived leads too, because archived is how Odoo marks a LOST deal and search_read hides
# them by default. Batch IN: one call for a whole traversal.
- name: leadsByPartner
  kind: api
  keyType: int
  operation: leadsSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  args:
    domain:
      - ["partner_id", "in", []]
      - "|"
      - ["active", "=", true]
      - ["active", "=", false]
    fields: [name, partner_id, expected_revenue, probability, email_from, stage_id, create_date, date_closed, date_last_stage_update, won_status, date_deadline, user_id, active, company_currency, type, priority]
    # No `load: ""`: a lead door is a PARTNER-DOOR shape (see the top of this file).
    limit: 1000
  compute:
    partner_id: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    email_from: "CASE r.email_from WHEN false THEN null ELSE r.email_from END"
    stage_id: "CASE r.stage_id WHEN false THEN null ELSE r.stage_id[0] END"
    create_date: "CASE r.create_date WHEN false THEN null ELSE r.create_date END"
    date_closed: "CASE r.date_closed WHEN false THEN null ELSE r.date_closed END"
    date_last_stage_update: "CASE r.date_last_stage_update WHEN false THEN null ELSE r.date_last_stage_update END"
    won_status: "CASE r.won_status WHEN false THEN null ELSE r.won_status END"
    date_deadline: "CASE r.date_deadline WHEN false THEN null ELSE r.date_deadline END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    type: "CASE r.type WHEN false THEN null ELSE r.type END"
    # The vocabulary's Opportunity — see leadsByStage.
    title: "r.name"
    stage: "CASE r.stage_id WHEN false THEN null ELSE r.stage_id[1] END"
    ownerName: "CASE r.user_id WHEN false THEN null ELSE r.user_id[1] END"
    currency: "CASE r.company_currency WHEN false THEN null ELSE r.company_currency[1] END"
    sourceUrl: "'http://localhost:8069/odoo/crm.lead/' + toString(r.id)"
    status: "CASE r.won_status WHEN 'pending' THEN 'open' WHEN 'won' THEN 'won' WHEN 'lost' THEN 'lost' ELSE null END"
    amount: "toFloat(r.expected_revenue)"
    probabilityPercent: "toFloat(r.probability)"
    probability: "toFloat(r.probability) / 100.0"
    priorityLabel: "CASE r.priority WHEN '0' THEN 'low' WHEN '1' THEN 'medium' WHEN '2' THEN 'high' WHEN '3' THEN 'very_high' ELSE null END"
    closeOn: "CASE r.won_status WHEN 'pending' THEN (CASE r.date_deadline WHEN false THEN null ELSE r.date_deadline END) ELSE (CASE r.date_closed WHEN false THEN null ELSE substring(r.date_closed, 0, 10) END) END"
  # "Acme's open deals" asks Odoo for Acme's open deals, not for all of Acme's history.
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: title, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: title, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: partner_id, op: EQUALS, argPath: "domain.-", clause: ["partner_id", "=", "{value}"] }
    - { property: partner_id, op: IN, argPath: "domain.-", clause: ["partner_id", "in", "{values}"] }
    - { property: stage, op: EQUALS, argPath: "domain.-", clause: ["stage_id.name", "=", "{value}"] }
    - { property: stage, op: IN, argPath: "domain.-", clause: ["stage_id.name", "in", "{values}"] }
    - { property: stage_id, op: EQUALS, argPath: "domain.-", clause: ["stage_id", "=", "{value}"] }
    - { property: stage_id, op: IN, argPath: "domain.-", clause: ["stage_id", "in", "{values}"] }
    - { property: won_status, op: EQUALS, argPath: "domain.-", clause: ["won_status", "=", "{value}"] }
    - { property: won_status, op: IN, argPath: "domain.-", clause: ["won_status", "in", "{values}"] }
    - { property: status, op: EQUALS, argPath: "domain.-", clause: ["won_status", "=", "{value}"], valuePattern: '^(won|lost)$' }
    - { property: active, op: EQUALS, argPath: "domain.-", clause: ["active", "=", "{value}"] }
    - { property: type, op: EQUALS, argPath: "domain.-", clause: ["type", "=", "{value}"] }
    - { property: user_id, op: EQUALS, argPath: "domain.-", clause: ["user_id", "=", "{value}"] }
    - { property: user_id, op: IN, argPath: "domain.-", clause: ["user_id", "in", "{values}"] }
    - { property: ownerName, op: EQUALS, argPath: "domain.-", clause: ["user_id.name", "=", "{value}"] }
    - { property: email_from, op: EQUALS, argPath: "domain.-", clause: ["email_from", "=", "{value}"] }
    - { property: email_from, op: CONTAINS, argPath: "domain.-", clause: ["email_from", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: probabilityPercent, op: GREATER_THAN, argPath: "domain.-", clause: ["probability", ">", "{value}"] }
    - { property: probabilityPercent, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["probability", ">=", "{value}"] }
    - { property: probabilityPercent, op: LESS_THAN, argPath: "domain.-", clause: ["probability", "<", "{value}"] }
    - { property: probabilityPercent, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["probability", "<=", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN, argPath: "domain.-", clause: ["expected_revenue", ">", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", ">=", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN, argPath: "domain.-", clause: ["expected_revenue", "<", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", "<=", "{value}"] }
    - { property: amount, op: GREATER_THAN, argPath: "domain.-", clause: ["expected_revenue", ">", "{value}"] }
    - { property: amount, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", ">=", "{value}"] }
    - { property: amount, op: LESS_THAN, argPath: "domain.-", clause: ["expected_revenue", "<", "{value}"] }
    - { property: amount, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", "<=", "{value}"] }
    - { property: create_date, op: GREATER_THAN, argPath: "domain.-", clause: ["create_date", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: create_date, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["create_date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: create_date, op: LESS_THAN, argPath: "domain.-", clause: ["create_date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: create_date, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["create_date", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: GREATER_THAN, argPath: "domain.-", clause: ["date_closed", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date_closed, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: LESS_THAN, argPath: "domain.-", clause: ["date_closed", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: GREATER_THAN, argPath: "domain.-", clause: ["date_last_stage_update", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date_last_stage_update, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_last_stage_update", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: LESS_THAN, argPath: "domain.-", clause: ["date_last_stage_update", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_last_stage_update", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_deadline, op: GREATER_THAN, argPath: "domain.-", clause: ["date_deadline", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_deadline", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: LESS_THAN, argPath: "domain.-", clause: ["date_deadline", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_deadline", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
  # BATCHED AND TO-MANY: one call carries up to `maxKeysPerCall` partners, and `limit` bounds
  # the WHOLE response, not each key. Without paging a prolific partner fills the batch and
  # the partners after it come back with nothing — the starvation `batchSafe: false` exists
  # for, arriving through `limit` instead. Paging reads the chunk out in full, so every key
  # in it is complete; Odoo pages by absolute offset.
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  maxKeysPerCall: 200
  # Per customer as numbers: one read_group per measure, grouped by partner, for every key at once.
  aggregates:
    - measure: count
      operation: leadsReadGroup
      args:
        domain:
          - ["partner_id", "in", []]
          - "|"
          - ["active", "=", true]
          - ["active", "=", false]
        fields: ["expected_revenue:sum"]
        groupby: [partner_id]
      records: "$[*]"
      valueField: partner_id_count
      keyField: partner_id
    - measure: sum
      of: expected_revenue
      operation: leadsReadGroup
      args:
        domain:
          - ["partner_id", "in", []]
          - "|"
          - ["active", "=", true]
          - ["active", "=", false]
        fields: ["expected_revenue:sum"]
        groupby: [partner_id]
      records: "$[*]"
      valueField: expected_revenue
      keyField: partner_id
    - measure: sum
      of: amount
      operation: leadsReadGroup
      args:
        domain:
          - ["partner_id", "in", []]
          - "|"
          - ["active", "=", true]
          - ["active", "=", false]
        fields: ["expected_revenue:sum"]
        groupby: [partner_id]
      records: "$[*]"
      valueField: amount
      keyField: partner_id
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

- name: contactsByCompany
  kind: api
  keyType: int
  operation: partnersSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  args:
    domain:
      - ["parent_id", "in", []]
      # People only. A company's parent_id is its PARENT COMPANY, so without this a subsidiary
      # came back as a contact of its parent — a company filed as a person. Subsidiaries have
      # their own door, subsidiariesByParent.
      - ["is_company", "=", false]
    fields: [name, email, function, phone, parent_id]
    load: ""
    limit: 1000
  compute:
    # The vocabulary's AccountContact keys a person by email, LOWER CASE — that is how a contact
    # is recognised as the requester of a support case. Odoo keeps the address as typed.
    email: "CASE r.email WHEN false THEN null ELSE toLower(r.email) END"
    function: "CASE r.function WHEN false THEN null ELSE r.function END"
    jobTitle: "CASE r.function WHEN false THEN null ELSE r.function END"
    phone: "CASE r.phone WHEN false THEN null ELSE r.phone END"
    parent_id: "CASE r.parent_id WHEN false THEN null ELSE r.parent_id END"
    sourceUrl: "'http://localhost:8069/odoo/res.partner/' + toString(r.id)"
  # email is lower-cased above, so equality is asked of Odoo without case (`=ilike`), which reads
  # `%` and `_` as wildcards — an address holding either stays a graph-side filter.
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci }
    - { property: email, op: EQUALS, argPath: "domain.-", clause: ["email", "=ilike", "{value}"], valuePattern: '^([^%_]+)$', match: ci }
    - { property: email, op: CONTAINS, argPath: "domain.-", clause: ["email", "ilike", "{value}"], match: ci }
    - { property: function, op: CONTAINS, argPath: "domain.-", clause: ["function", "ilike", "{value}"], match: ci }
    - { property: jobTitle, op: CONTAINS, argPath: "domain.-", clause: ["function", "ilike", "{value}"], match: ci }
  # BATCHED AND TO-MANY: paged for the same reason as leadsByPartner.
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  maxKeysPerCall: 200
  cache: { kind: ttl, seconds: 900, negativeTtlSeconds: 900 }

# THE COMPANY HIERARCHY. On a company record Odoo's parent_id is its parent company (the
# "Related Company" field of a company form); on a person it is their employer. One field, two
# meanings, told apart by is_company. Every partner door therefore computes `parentCompanyId`
# — parent_id, but ONLY on a company — and SUBSIDIARY_OF keys on that, never on parent_id, so a
# walk up the hierarchy cannot step from a person to their employer.
#
# commercial_partner_id is not this. Odoo sets it to the record itself on every company, parent
# or not, and to the company on a person: it is how a contact rolls up to the company it
# trades as, and says nothing about who owns that company. It rides along as
# `commercialPartnerId` for exactly that roll-up.
#
# Down the hierarchy: the companies whose parent is one of the keys. Batched IN, and TO-MANY, so
# paged for the same reason as contactsByCompany. No materializedKeyField: the book sweeps that
# could be ridden are narrower than this edge (HAS_CUSTOMER stops at companies that have bought),
# and a subsidiary still being courted would be lost from its parent's family without a word.
- name: subsidiariesByParent
  kind: api
  keyType: int
  operation: partnersSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  args:
    domain:
      - ["parent_id", "in", []]
      - ["is_company", "=", true]
    fields: [name, email, phone, city, country_id, is_company, website, parent_id, commercial_partner_id, industry_id, user_id, customer_rank, supplier_rank]
    # No `load: ""` here, unlike every other door: see THE PARTNER DOORS at the top.
    limit: 1000
  compute:
    email: "CASE r.email WHEN false THEN null ELSE r.email END"
    phone: "CASE r.phone WHEN false THEN null ELSE r.phone END"
    city: "CASE r.city WHEN false THEN null ELSE r.city END"
    country_id: "CASE r.country_id WHEN false THEN null ELSE r.country_id[0] END"
    country: "CASE r.country_id WHEN false THEN null ELSE r.country_id[1] END"
    website: "CASE r.website WHEN false THEN null ELSE r.website END"
    industry_id: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[0] END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    industry: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[1] END"
    ownerName: "CASE r.user_id WHEN false THEN null ELSE r.user_id[1] END"
    relationship: "CASE WHEN r.customer_rank > 0 THEN 'customer' WHEN r.supplier_rank > 0 THEN 'other' ELSE 'prospect' END"
    sourceUrl: "'http://localhost:8069/odoo/res.partner/' + toString(r.id)"
    parent_id: "CASE r.parent_id WHEN false THEN null ELSE r.parent_id[0] END"
    parentCompanyId: "CASE r.parent_id WHEN false THEN null ELSE (CASE WHEN toString(r.is_company) = 'true' THEN r.parent_id[0] ELSE null END) END"
    commercialPartnerId: "CASE r.commercial_partner_id WHEN false THEN null ELSE r.commercial_partner_id[0] END"
  # The filters a question about a group writes — which subsidiary, by name, domain, country or
  # owner — so Odoo narrows the family instead of the graph reading all of it.
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: email, op: EQUALS, argPath: "domain.-", clause: ["email", "=", "{value}"] }
    - { property: email, op: CONTAINS, argPath: "domain.-", clause: ["email", "ilike", "{value}"], match: ci }
    - { property: email, op: IN, argPath: "domain.-", clause: ["email", "in", "{values}"] }
    - { property: city, op: EQUALS, argPath: "domain.-", clause: ["city", "=", "{value}"] }
    - { property: city, op: CONTAINS, argPath: "domain.-", clause: ["city", "ilike", "{value}"], match: ci }
    - { property: website, op: EQUALS, argPath: "domain.-", clause: ["website", "=", "{value}"] }
    - { property: website, op: CONTAINS, argPath: "domain.-", clause: ["website", "ilike", "{value}"], match: ci }
    - { property: phone, op: EQUALS, argPath: "domain.-", clause: ["phone", "=", "{value}"] }
    - { property: is_company, op: EQUALS, argPath: "domain.-", clause: ["is_company", "=", "{value}"] }
    - { property: country_id, op: EQUALS, argPath: "domain.-", clause: ["country_id", "=", "{value}"] }
    - { property: country_id, op: IN, argPath: "domain.-", clause: ["country_id", "in", "{values}"] }
    - { property: country, op: EQUALS, argPath: "domain.-", clause: ["country_id.name", "=", "{value}"] }
    - { property: industry_id, op: EQUALS, argPath: "domain.-", clause: ["industry_id", "=", "{value}"] }
    - { property: industry_id, op: IN, argPath: "domain.-", clause: ["industry_id", "in", "{values}"] }
    - { property: industry, op: EQUALS, argPath: "domain.-", clause: ["industry_id.name", "=", "{value}"] }
    - { property: user_id, op: EQUALS, argPath: "domain.-", clause: ["user_id", "=", "{value}"] }
    - { property: user_id, op: IN, argPath: "domain.-", clause: ["user_id", "in", "{values}"] }
    - { property: ownerName, op: EQUALS, argPath: "domain.-", clause: ["user_id.name", "=", "{value}"] }
    - { property: parent_id, op: EQUALS, argPath: "domain.-", clause: ["parent_id", "=", "{value}"] }
    - { property: parent_id, op: IN, argPath: "domain.-", clause: ["parent_id", "in", "{values}"] }
    - { property: relationship, op: EQUALS, argPath: "domain.-", clause: ["customer_rank", ">", 0], valuePattern: '^(customer)$' }
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  maxKeysPerCall: 200
  cache: { kind: ttl, seconds: 900, negativeTtlSeconds: 900 }

# What was written on a partner's own record — a company or a person. The record carries
# `res_id`, the partner it was written on, so no echo is needed and the batch is safe.
- name: messagesByPartner
  kind: api
  keyType: int
  operation: messagesSearchRead
  records: "$[*]"
  keyArg: "domain.1.2"
  args:
    domain:
      - ["model", "=", "res.partner"]
      - ["res_id", "in", []]
      - ["message_type", "in", ["comment", "email"]]
    fields: [res_id, body, date, author_id, subject, message_type]
    # No `load: ""`: author_id is this door's only many2one, and its pair is where the author's NAME is.
    order: "date desc, id desc"
    limit: 1000
  compute:
    body: "CASE r.body WHEN false THEN null ELSE r.body END"
    date: "CASE r.date WHEN false THEN null ELSE r.date END"
    author_id: "CASE r.author_id WHEN false THEN null ELSE r.author_id[0] END"
    authorName: "CASE r.author_id WHEN false THEN null ELSE r.author_id[1] END"
    author: "CASE r.author_id WHEN false THEN null ELSE r.author_id[1] END"
    subject: "CASE r.subject WHEN false THEN null ELSE r.subject END"
    message_type: "CASE r.message_type WHEN false THEN null ELSE r.message_type END"
    model: "'res.partner'"
    # The vocabulary's AccountNote.writtenOn: the day, from Odoo's UTC timestamp.
    writtenOn: "CASE r.date WHEN false THEN null ELSE substring(r.date, 0, 10) END"
    # The same key the book sweep computes, so a note reached either way reads alike.
    partnerKey: "r.res_id"
    sourceUrl: "'http://localhost:8069/odoo/res.partner/' + toString(r.res_id)"
  pushdown:
    - { property: message_type, op: EQUALS, argPath: "domain.-", clause: ["message_type", "=", "{value}"] }
    - { property: message_type, op: IN, argPath: "domain.-", clause: ["message_type", "in", "{values}"] }
    - { property: author_id, op: EQUALS, argPath: "domain.-", clause: ["author_id", "=", "{value}"] }
    - { property: author_id, op: IN, argPath: "domain.-", clause: ["author_id", "in", "{values}"] }
    - { property: authorName, op: EQUALS, argPath: "domain.-", clause: ["author_id.name", "=", "{value}"] }
    - { property: date, op: GREATER_THAN, argPath: "domain.-", clause: ["date", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date, op: LESS_THAN, argPath: "domain.-", clause: ["date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: writtenOn, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: writtenOn, op: LESS_THAN, argPath: "domain.-", clause: ["date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: writtenOn, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", "<=", "{value} 23:59:59"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
  # BATCHED AND TO-MANY: paged for the same reason as leadsByPartner.
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  maxKeysPerCall: 200
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

# EVERY partner, company and person alike. `customersAll` filters `customer_rank > 0` and
# `companiesAll` filters `is_company = true`, so between them they see only COMPANIES — measured
# 2026-09-21, 1,333 of them. Chatter does not respect that boundary: of 4,000 notes written on
# `res.partner`, only 1,333 were on a partner either door could reach; the other 2,667 were
# written on CONTACTS, the people at those companies, and were unreachable except one company
# at a time through `contactsByCompany`. A notes-across-the-book question needs both sides in
# one sweep, and `is_company` is what separates them afterwards.
- name: partnersAll
  kind: api
  operation: partnersSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    # No domain at all: the whole partner table, companies and people together.
    domain: []
    fields: [name, email, phone, city, country_id, is_company, website, parent_id, commercial_partner_id, industry_id, user_id, customer_rank, supplier_rank]
    # No `load: ""` here, unlike every other door: see THE PARTNER DOORS at the top.
    limit: 1000
  compute:
    email: "CASE r.email WHEN false THEN null ELSE r.email END"
    phone: "CASE r.phone WHEN false THEN null ELSE r.phone END"
    city: "CASE r.city WHEN false THEN null ELSE r.city END"
    country_id: "CASE r.country_id WHEN false THEN null ELSE r.country_id[0] END"
    country: "CASE r.country_id WHEN false THEN null ELSE r.country_id[1] END"
    website: "CASE r.website WHEN false THEN null ELSE r.website END"
    industry_id: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[0] END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    industry: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[1] END"
    ownerName: "CASE r.user_id WHEN false THEN null ELSE r.user_id[1] END"
    relationship: "CASE WHEN r.customer_rank > 0 THEN 'customer' WHEN r.supplier_rank > 0 THEN 'other' ELSE 'prospect' END"
    sourceUrl: "'http://localhost:8069/odoo/res.partner/' + toString(r.id)"
    parent_id: "CASE r.parent_id WHEN false THEN null ELSE r.parent_id[0] END"
    parentCompanyId: "CASE r.parent_id WHEN false THEN null ELSE (CASE WHEN toString(r.is_company) = 'true' THEN r.parent_id[0] ELSE null END) END"
    commercialPartnerId: "CASE r.commercial_partner_id WHEN false THEN null ELSE r.commercial_partner_id[0] END"
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: email, op: EQUALS, argPath: "domain.-", clause: ["email", "=", "{value}"] }
    - { property: email, op: CONTAINS, argPath: "domain.-", clause: ["email", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: email, op: IN, argPath: "domain.-", clause: ["email", "in", "{values}"] }
    - { property: city, op: EQUALS, argPath: "domain.-", clause: ["city", "=", "{value}"] }
    - { property: city, op: CONTAINS, argPath: "domain.-", clause: ["city", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: website, op: EQUALS, argPath: "domain.-", clause: ["website", "=", "{value}"] }
    - { property: website, op: CONTAINS, argPath: "domain.-", clause: ["website", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: phone, op: EQUALS, argPath: "domain.-", clause: ["phone", "=", "{value}"] }
    - { property: is_company, op: EQUALS, argPath: "domain.-", clause: ["is_company", "=", "{value}"] }
    - { property: country_id, op: EQUALS, argPath: "domain.-", clause: ["country_id", "=", "{value}"] }
    - { property: country_id, op: IN, argPath: "domain.-", clause: ["country_id", "in", "{values}"] }
    - { property: country, op: EQUALS, argPath: "domain.-", clause: ["country_id.name", "=", "{value}"] }
    - { property: industry_id, op: EQUALS, argPath: "domain.-", clause: ["industry_id", "=", "{value}"] }
    - { property: industry_id, op: IN, argPath: "domain.-", clause: ["industry_id", "in", "{values}"] }
    - { property: industry, op: EQUALS, argPath: "domain.-", clause: ["industry_id.name", "=", "{value}"] }
    - { property: user_id, op: EQUALS, argPath: "domain.-", clause: ["user_id", "=", "{value}"] }
    - { property: user_id, op: IN, argPath: "domain.-", clause: ["user_id", "in", "{values}"] }
    - { property: ownerName, op: EQUALS, argPath: "domain.-", clause: ["user_id.name", "=", "{value}"] }
    - { property: parent_id, op: EQUALS, argPath: "domain.-", clause: ["parent_id", "=", "{value}"] }
    - { property: parent_id, op: IN, argPath: "domain.-", clause: ["parent_id", "in", "{values}"] }
    - { property: relationship, op: EQUALS, argPath: "domain.-", clause: ["customer_rank", ">", 0], valuePattern: '^(customer)$' }
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  # HOW MANY PARTNERS: one search_count over the door's own domain, not a walk of the book.
  # Exact under the same rules as customersAll's count.
  aggregates:
    - measure: count
      operation: partnersSearchCount
      args:
        domain: []
      valueField: "$"
      keyField: scopeKey
  cache: { kind: ttl, seconds: 900, negativeTtlSeconds: 900 }

# THE WHOLE CHATTER BOOK, swept once. The per-anchor doors above (`messagesByPartner`,
# `messagesByLead`) are right for a question about ONE account and wrong for a question about
# the book: asking them across every account binds one anchor per account and the engine
# refuses above `maxAnchors` (200). Measured 2026-09-21: 1,516 accounts had an open support
# case, so every notes-across-the-book view died in the planner — `HealthCompanyNotesForOpenCases`
# and its two siblings returned an ERROR, the Account Signals app withheld the CRM signals
# entirely, and the page said so rather than calling a troubled account good news.
#
# One sweep instead. `model` rides on every record, so ONE door serves all three questions —
# notes on the company, on a person there, and on a deal — and the consumer picks the side it
# wants with `WHERE n.model = …` rather than three producers fetching the same table.
#
# The same shape as `companiesAll` / `leadsAll`: pinned by the literal book scope, echoed back
# as `scopeKey`, paged by absolute offset. maxPages is high because chatter is the most
# numerous thing in an Odoo instance by a wide margin — hitting it warns rather than silently
# truncating.
- name: messagesAll
  kind: api
  operation: messagesSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      # Both sides of the vocabulary's AccountNote: what was written on a partner (the company
      # or a contact there) and what was written on an opportunity.
      - ["model", "in", ["res.partner", "crm.lead"]]
      - ["message_type", "in", ["comment", "email"]]
    fields: [model, res_id, body, date, author_id, subject, message_type]
    # No `load: ""`: author_id is this door's only many2one, and its pair is where the author's NAME is.
    order: "date desc, id desc"
    limit: 1000
  compute:
    model: "CASE r.model WHEN false THEN null ELSE r.model END"
    body: "CASE r.body WHEN false THEN null ELSE r.body END"
    date: "CASE r.date WHEN false THEN null ELSE r.date END"
    author_id: "CASE r.author_id WHEN false THEN null ELSE r.author_id[0] END"
    authorName: "CASE r.author_id WHEN false THEN null ELSE r.author_id[1] END"
    author: "CASE r.author_id WHEN false THEN null ELSE r.author_id[1] END"
    subject: "CASE r.subject WHEN false THEN null ELSE r.subject END"
    message_type: "CASE r.message_type WHEN false THEN null ELSE r.message_type END"
    # The vocabulary's AccountNote.writtenOn: the day, from Odoo's UTC timestamp.
    writtenOn: "CASE r.date WHEN false THEN null ELSE substring(r.date, 0, 10) END"
    # Which deal, or which company or contact, the message is on, split by model: `res_id` alone
    # collides across the two (deal 7 and partner 7 are different records). These are what the
    # anchored note joins ride when a query has swept the whole chatter (materializedKeyField).
    leadKey: "CASE r.model WHEN 'crm.lead' THEN r.res_id ELSE null END"
    partnerKey: "CASE r.model WHEN 'res.partner' THEN r.res_id ELSE null END"
    sourceUrl: "CASE r.model WHEN false THEN null ELSE 'http://localhost:8069/odoo/' + r.model + '/' + toString(r.res_id) END"
  pushdown:
    - { property: model, op: EQUALS, argPath: "domain.-", clause: ["model", "=", "{value}"] }
    - { property: model, op: IN, argPath: "domain.-", clause: ["model", "in", "{values}"] }
    - { property: res_id, op: EQUALS, argPath: "domain.-", clause: ["res_id", "=", "{value}"] }
    - { property: res_id, op: IN, argPath: "domain.-", clause: ["res_id", "in", "{values}"] }
    - { property: message_type, op: EQUALS, argPath: "domain.-", clause: ["message_type", "=", "{value}"] }
    - { property: message_type, op: IN, argPath: "domain.-", clause: ["message_type", "in", "{values}"] }
    - { property: author_id, op: EQUALS, argPath: "domain.-", clause: ["author_id", "=", "{value}"] }
    - { property: author_id, op: IN, argPath: "domain.-", clause: ["author_id", "in", "{values}"] }
    - { property: authorName, op: EQUALS, argPath: "domain.-", clause: ["author_id.name", "=", "{value}"] }
    - { property: date, op: GREATER_THAN, argPath: "domain.-", clause: ["date", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date, op: LESS_THAN, argPath: "domain.-", clause: ["date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: writtenOn, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: writtenOn, op: LESS_THAN, argPath: "domain.-", clause: ["date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: writtenOn, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", "<=", "{value} 23:59:59"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 100 }
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }
