  cache: { kind: ttl, seconds: 3600, negativeTtlSeconds: 3600 }

# A lead's chatter — the emails and comments on the opportunity, which is where the actual
# state of a deal lives (the stage field says Proposition; the thread says the customer has
# gone quiet). Comments and emails only: tracking notes ("Stage changed") are noise to a
# reader and poison to a sentiment judge. Batched: every message carries the deal it is on as
# `res_id`, so `leadKey` is computed from it — an echo cost one call per deal, fifty for triage.
- name: messagesByLead
  kind: api
  keyType: int
  operation: messagesSearchRead
  records: "$[*]"
  keyArg: "domain.1.2"
  args:
    domain:
      - ["model", "=", "crm.lead"]
      - ["res_id", "in", []]
      - ["message_type", "in", ["comment", "email"]]
    fields: [res_id, body, date, author_id, subject, message_type]
    # No `load: ""`: author_id is this door's only many2one, and its pair is where the author's NAME is.
    order: "date desc, id desc"
    limit: 1000
  compute:
    leadKey: "r.res_id"
    body: "CASE r.body WHEN false THEN null ELSE r.body END"
    date: "CASE r.date WHEN false THEN null ELSE r.date END"
    author_id: "CASE r.author_id WHEN false THEN null ELSE r.author_id[0] END"
    authorName: "CASE r.author_id WHEN false THEN null ELSE r.author_id[1] END"
    author: "CASE r.author_id WHEN false THEN null ELSE r.author_id[1] END"
    subject: "CASE r.subject WHEN false THEN null ELSE r.subject END"
    message_type: "CASE r.message_type WHEN false THEN null ELSE r.message_type END"
    model: "'crm.lead'"
    about: "'opportunity'"
    # The vocabulary's AccountNote.writtenOn: the day, from Odoo's UTC timestamp.
    writtenOn: "CASE r.date WHEN false THEN null ELSE substring(r.date, 0, 10) END"
    sourceUrl: "'http://localhost:8069/odoo/crm.lead/' + toString(r.res_id)"
  pushdown:
    - { property: message_type, op: EQUALS, argPath: "domain.-", clause: ["message_type", "=", "{value}"] }
    - { property: message_type, op: IN, argPath: "domain.-", clause: ["message_type", "in", "{values}"] }
    - { property: author_id, op: EQUALS, argPath: "domain.-", clause: ["author_id", "=", "{value}"] }
    - { property: author_id, op: IN, argPath: "domain.-", clause: ["author_id", "in", "{values}"] }
    - { property: authorName, op: EQUALS, argPath: "domain.-", clause: ["author_id.name", "=", "{value}"] }
    - { property: date, op: GREATER_THAN, argPath: "domain.-", clause: ["date", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date, op: LESS_THAN, argPath: "domain.-", clause: ["date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: writtenOn, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: writtenOn, op: LESS_THAN, argPath: "domain.-", clause: ["date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: writtenOn, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date", "<=", "{value} 23:59:59"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
  # BATCHED AND TO-MANY — paged so a talkative deal cannot starve the others in its chunk.
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  maxKeysPerCall: 200
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

# ── The preparation surface: meetings and scheduled next-actions, behind the book door
# like every other set. This is data Odoo shows one record at a time; the point of having
# it here is composing it with everything else in one breath.

- name: meetingsAll
  kind: api
  operation: calendarSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain: []
    # partner_ids is the attendee list — a many2many, so it arrives as an id LIST even
    # under load:"" — which is exactly what the per-element MEETING_WITH join wants.
    fields: [name, start, stop, allday, location, description, partner_ids, user_id]
    load: ""
    order: "start asc, id asc"
    limit: 1000
  compute:
    start: "CASE r.start WHEN false THEN null ELSE r.start END"
    stop: "CASE r.stop WHEN false THEN null ELSE r.stop END"
    location: "CASE r.location WHEN false THEN null ELSE r.location END"
    description: "CASE r.description WHEN false THEN null ELSE r.description END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id END"
    # The vocabulary's Meeting.
    title: "r.name"
    startsOn: "CASE r.start WHEN false THEN null ELSE substring(r.start, 0, 10) END"
    sourceUrl: "'http://localhost:8069/odoo/calendar.event/' + toString(r.id)"
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci }
    - { property: start, op: GREATER_THAN, argPath: "domain.-", clause: ["start", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: start, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["start", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: start, op: LESS_THAN, argPath: "domain.-", clause: ["start", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: start, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["start", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: stop, op: GREATER_THAN, argPath: "domain.-", clause: ["stop", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: stop, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["stop", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: stop, op: LESS_THAN, argPath: "domain.-", clause: ["stop", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: stop, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["stop", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: startsOn, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["start", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: startsOn, op: LESS_THAN, argPath: "domain.-", clause: ["start", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: startsOn, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["start", "<=", "{value} 23:59:59"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
  # Paged like every other book door: unpaged, one call returned `limit` rows and a calendar
  # longer than that read as a calendar that small.
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

- name: activitiesAll
