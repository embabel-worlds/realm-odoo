    - { property: date_deadline, op: LESS_THAN, argPath: "domain.-", clause: ["date_deadline", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_deadline", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: closeOn, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: closeOn, op: LESS_THAN, argPath: "domain.-", clause: ["date_closed", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: closeOn, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", "<=", "{value} 23:59:59"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: closeOn, op: GREATER_THAN, argPath: "domain.-", clause: ["date_closed", ">", "{value} 23:59:59"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
