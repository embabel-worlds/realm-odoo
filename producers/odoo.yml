# Odoo spells "not set" as FALSE for every kind of field — text, selection, date, many2one —
# and only a real boolean means it. Passed through, a subject of `false` fails `IS NULL`, wins a
# `coalesce`, and puts a boolean in a string column. So each producer's `compute:` turns `false`
# in any field that is not a boolean into null, the one spelling Cypher reads as "no
# value". Comparing a string or a number with `false` is simply not equal in Cypher, so a real
# value passes through untouched. Numbers are not listed; Odoo sends 0 for those, which is a value.

# Every producer speaks to Odoo's MIDDLE TIER — search_read through JSON-2 — never the
# database. The joins key on BARE many2one ids: passed through raw, partner_id arrives as an
# [id, name] pair and every traversal silently matches nothing. A door either asks for bare ids
# with `load: ""`, or fetches the pairs and computes each many2one back to its id — the rule below.
#
# THE PARTNER, LEAD AND INVOICE DOORS keep the rule the second way. A partner is what the
# business vocabulary's CustomerAccount is filled from, and the account wants NAMES Odoo only
# sends inside a many2one pair: the industry ("Manufacturing") and the salesperson ("Mike
# Davis"). JSON-2's search_read cannot read a related field by path, and `load: ""` throws the
# name away. A lead is the vocabulary's Opportunity, which wants the stage ("Proposal"), the
# salesperson and the currency the same way; an invoice wants its currency. So these doors fetch
# the pairs, and their `compute:` puts every many2one back to its bare id (`r.x[0]`) — the shape
# the rest of the realm keys on — while lifting the name (`r.x[1]`) into a property of its own.
# Every expression reads the record as fetched, so `industry` sees the pair even though
# `industry_id` is computed to an id beside it.
#
# `sourceUrl` is built from the id against Odoo's BROWSER address, which is not the API's: the
# appliance reaches Odoo at the spec's server URL, a person reaches it at this one. It is an
# install-specific fact, the twin of `ODOO_BASE` in apps/prospect.js — see the README.
#
# FIELD SELECTION. Every door names its `fields`; search_read returns only those, so a door costs
# the columns the realm reads and not the model's hundred. Add a field here when a type needs it,
# never by dropping the list.
#
# WHAT THE SOURCE ABSORBS DECIDES WHAT THE QUESTION COSTS. An Odoo domain is a list of triples
# ANDed together, so `domain.-` appends one conjunct and no `linkPrevious` is needed. Every
# `pushdown:` property is the name the QUERY writes; the clause is what Odoo is asked, which is
# how a vocabulary word reaches Odoo's own field (`stage` → `stage_id.name`, `ownerName` →
# `user_id.name`). The third element is a whole-node `{value}`, so a number reaches Odoo
# as a number rather than as its digits in quotes — and an id written as '42' reaches it as 42,
# which is the only spelling an id domain matches.
#
#   - Text CONTAINS is `ilike`, declared `match: ci`: Odoo ignores case there, so it also answers
#     `toLower(c.name) CONTAINS 'acme'`. `ilike` reads `%` and `_` as wildcards, which only ever
#     WIDENS what Odoo returns; the graph re-applies the query's own comparison, so rows stay
#     exact. A count cannot be re-filtered, so the doors that declare `aggregates:` guard
#     their `ilike` rules (see AGGREGATES below).
#   - Dates carry a `valuePattern`. A datetime field (create_date, date_closed, start …) is UTC
#     and Odoo compares it against 'YYYY-MM-DD' (midnight) or 'YYYY-MM-DD HH:MM:SS'; a date field
#     (date_deadline, invoice_date_due) against 'YYYY-MM-DD' only. Those are also the spellings
#     the graph compares the fetched strings in, so source and graph agree. Anything else — an ISO
#     'T', a zone offset — stays a graph-side filter and the engine says so
#     (PUSHDOWN_VALUE_UNMATCHED). `>` a bare date is not pushed: Odoo reads the date as midnight,
#     the graph reads '2026-10-22 00:00:00' as AFTER '2026-10-22', and a record at exactly
#     midnight would be lost.
#   - Odoo's `in` with an empty list matches nothing, which is what an empty Cypher list means.
#   - ONE rule per property and operator. A `valuePattern` that refuses a value makes the engine
#     say the filter was not sent (PUSHDOWN_VALUE_UNMATCHED), rule by rule — so two rules that
#     split a property's values between them would each report the other's values as unsent.
#     That is why `status` maps only 'won' and 'lost' (to won_status) on the doors that hold every
#     deal and only 'open' on the pipeline door, and why `priorityLabel` (four words for four
#     codes) is filtered in the graph.
#
# AGGREGATES — "how many" and "how much", answered by Odoo. JSON-2 has the methods: `search_count`
# answers a bare number, `read_group` one row per group with `<field>_count` (or `__count`
# ungrouped) and each `field:sum` under the field's own name. Each aggregate declares its OWN call —
# `operation`, `args` — because a listing's arguments are a page: `search_count` reads the page
# `limit` as an upper bound and counts at most a page, and `read_group` needs a `groupby` no
# search_read call may carry. So the listing's `fields`, `limit`, `order` and `paging` never reach
# it; the keys and every pushed filter still do, appended to the aggregate's own domain, which
# restates the door's fixed conjuncts. Its rows pass through the door's `compute:`, which is how a
# grouped row's [id, name] partner pair becomes the `partnerKey` it is attributed by.
#
# A count over a WIDENED filter is not exact, and a number cannot be re-filtered the way records
# are. `ilike` widens two ways. It ignores case: the engine knows that from `match: ci` and
# reads the records for a count whose CONTAINS was written case-sensitively. It also reads `%`
# and `_` as wildcards, so on every door that declares aggregates each `ilike` rule refuses a
# value holding either (`valuePattern`). Such a value is then filtered in the graph, and the
# engine says it was not sent.

# CACHE. Every door is a TTL cache, and every door also caches a miss (`negativeTtlSeconds`):
# "this customer has no unpaid invoices" is the common answer, an empty calendar is an answer too,
# and a positive-only cache asks Odoo again on every query. Partners change least (15 minutes); deals,
# invoices, chatter and the calendar change with the working day (5 minutes); a decided deal —
# won or lost — almost never changes again (an hour).

# Open pipeline by stage NAME — the scan door. The anchor key (a stage name, e.g.
# 'Proposition') is injected into the domain's IN list; each record carries the stage it sits
# at as `stageKey`, computed from its own stage pair — so one call answers several stages, where
# an echoed key would have cost a call per stage.
- name: leadsByStage
  kind: api
  operation: leadsSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  args:
    domain:
      - ["stage_id.name", "in", []]
      - ["active", "=", true]
      # Odoo spells "no partner" as FALSE, not null, and a false key in the batched
      # LEAD_OF traversal arrives at Postgres as the string 'false' inside an integer
      # IN-list — a 500. Until the engine drops falsy join keys, this door carries
      # only partnered leads; the trade is stated here rather than discovered.
      - ["partner_id", "!=", false]
    fields: [name, partner_id, expected_revenue, probability, email_from, stage_id, create_date, date_closed, date_last_stage_update, won_status, date_deadline, user_id, active, company_currency, type, priority]
    # No `load: ""`: a lead door is a PARTNER-DOOR shape (see the top of this file) — the
    # vocabulary wants the stage, salesperson and currency NAMES, which come only inside pairs.
    order: "expected_revenue desc, id desc"
    limit: 1000
  compute:
    stageKey: "CASE r.stage_id WHEN false THEN null ELSE r.stage_id[1] END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    partner_id: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    email_from: "CASE r.email_from WHEN false THEN null ELSE r.email_from END"
    stage_id: "CASE r.stage_id WHEN false THEN null ELSE r.stage_id[0] END"
    create_date: "CASE r.create_date WHEN false THEN null ELSE r.create_date END"
    date_closed: "CASE r.date_closed WHEN false THEN null ELSE r.date_closed END"
    date_last_stage_update: "CASE r.date_last_stage_update WHEN false THEN null ELSE r.date_last_stage_update END"
    won_status: "CASE r.won_status WHEN false THEN null ELSE r.won_status END"
    date_deadline: "CASE r.date_deadline WHEN false THEN null ELSE r.date_deadline END"
    type: "CASE r.type WHEN false THEN null ELSE r.type END"
    # The business vocabulary's Opportunity, in its own words: status is open/won/lost (Odoo
    # says `pending` for open), amount is the deal value, closeOn the expected close while open
    # and the day it was decided once won or lost, probability a FRACTION. Odoo's own fields stay
    # beside them — its percent as probabilityPercent.
    title: "r.name"
    # The vocabulary's names, lifted out of the pairs: the pipeline step in the CRM's own words,
    # the salesperson, and the company currency the amount is in.
    stage: "CASE r.stage_id WHEN false THEN null ELSE r.stage_id[1] END"
    ownerName: "CASE r.user_id WHEN false THEN null ELSE r.user_id[1] END"
    currency: "CASE r.company_currency WHEN false THEN null ELSE r.company_currency[1] END"
    sourceUrl: "'http://localhost:8069/odoo/crm.lead/' + toString(r.id)"
    status: "CASE r.won_status WHEN 'pending' THEN 'open' WHEN 'won' THEN 'won' WHEN 'lost' THEN 'lost' ELSE null END"
    amount: "toFloat(r.expected_revenue)"
    probabilityPercent: "toFloat(r.probability)"
    probability: "toFloat(r.probability) / 100.0"
    priorityLabel: "CASE r.priority WHEN '0' THEN 'low' WHEN '1' THEN 'medium' WHEN '2' THEN 'high' WHEN '3' THEN 'very_high' ELSE null END"
    closeOn: "CASE r.won_status WHEN 'pending' THEN (CASE r.date_deadline WHEN false THEN null ELSE r.date_deadline END) ELSE (CASE r.date_closed WHEN false THEN null ELSE substring(r.date_closed, 0, 10) END) END"
  # Biggest first, and said so: a top-N by expected_revenue over this door is the first page.
  orderedBy: [{ property: expected_revenue, descending: true }]
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: title, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: title, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci }
    - { property: partner_id, op: EQUALS, argPath: "domain.-", clause: ["partner_id", "=", "{value}"] }
    - { property: partner_id, op: IN, argPath: "domain.-", clause: ["partner_id", "in", "{values}"] }
    - { property: stage, op: EQUALS, argPath: "domain.-", clause: ["stage_id.name", "=", "{value}"] }
    - { property: stage, op: IN, argPath: "domain.-", clause: ["stage_id.name", "in", "{values}"] }
    - { property: stage_id, op: EQUALS, argPath: "domain.-", clause: ["stage_id", "=", "{value}"] }
    - { property: stage_id, op: IN, argPath: "domain.-", clause: ["stage_id", "in", "{values}"] }
    - { property: won_status, op: EQUALS, argPath: "domain.-", clause: ["won_status", "=", "{value}"] }
    - { property: won_status, op: IN, argPath: "domain.-", clause: ["won_status", "in", "{values}"] }
    - { property: status, op: EQUALS, argPath: "domain.-", clause: ["won_status", "=", "{value}"], valuePattern: '^(won|lost)$' }
    - { property: active, op: EQUALS, argPath: "domain.-", clause: ["active", "=", "{value}"] }
    - { property: type, op: EQUALS, argPath: "domain.-", clause: ["type", "=", "{value}"] }
    - { property: user_id, op: EQUALS, argPath: "domain.-", clause: ["user_id", "=", "{value}"] }
    - { property: user_id, op: IN, argPath: "domain.-", clause: ["user_id", "in", "{values}"] }
    - { property: ownerName, op: EQUALS, argPath: "domain.-", clause: ["user_id.name", "=", "{value}"] }
    - { property: email_from, op: EQUALS, argPath: "domain.-", clause: ["email_from", "=", "{value}"] }
    - { property: email_from, op: CONTAINS, argPath: "domain.-", clause: ["email_from", "ilike", "{value}"], match: ci }
    - { property: probabilityPercent, op: GREATER_THAN, argPath: "domain.-", clause: ["probability", ">", "{value}"] }
    - { property: probabilityPercent, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["probability", ">=", "{value}"] }
    - { property: probabilityPercent, op: LESS_THAN, argPath: "domain.-", clause: ["probability", "<", "{value}"] }
    - { property: probabilityPercent, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["probability", "<=", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN, argPath: "domain.-", clause: ["expected_revenue", ">", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", ">=", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN, argPath: "domain.-", clause: ["expected_revenue", "<", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", "<=", "{value}"] }
    - { property: amount, op: GREATER_THAN, argPath: "domain.-", clause: ["expected_revenue", ">", "{value}"] }
    - { property: amount, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", ">=", "{value}"] }
    - { property: amount, op: LESS_THAN, argPath: "domain.-", clause: ["expected_revenue", "<", "{value}"] }
    - { property: amount, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", "<=", "{value}"] }
    - { property: create_date, op: GREATER_THAN, argPath: "domain.-", clause: ["create_date", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: create_date, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["create_date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: create_date, op: LESS_THAN, argPath: "domain.-", clause: ["create_date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: create_date, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["create_date", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: GREATER_THAN, argPath: "domain.-", clause: ["date_closed", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date_closed, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: LESS_THAN, argPath: "domain.-", clause: ["date_closed", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: GREATER_THAN, argPath: "domain.-", clause: ["date_last_stage_update", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date_last_stage_update, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_last_stage_update", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: LESS_THAN, argPath: "domain.-", clause: ["date_last_stage_update", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_last_stage_update", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_deadline, op: GREATER_THAN, argPath: "domain.-", clause: ["date_deadline", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_deadline", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: LESS_THAN, argPath: "domain.-", clause: ["date_deadline", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_deadline", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
  # Paged like the book's other doors: one stage can hold more than a page —
  # and an unpaged door truncates at the limit, which a ranked view then refuses as INCOMPLETE.
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  maxKeysPerCall: 200
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

# Customers by id — the key-addressed door: a lead's partner_id, a meeting's attendees, a
# company's parent, an activity's partner. Batch IN, one call for a whole traversal.
- name: customersById
  kind: api
  # Odoo domain values are TYPED: partner_id in ["9"] matches nothing, silently.
  keyType: int
  operation: partnersSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  args:
    domain:
      - ["id", "in", []]
    # website rides along for the Diffbot bridge (types/diffbot.yml): a domain
    # identifies a company and a name does not, and website is Odoo's own field.
    fields: [name, email, phone, city, country_id, is_company, website, parent_id, commercial_partner_id, industry_id, user_id, customer_rank, supplier_rank]
    # No `load: ""` here, unlike every other door: see THE PARTNER DOORS at the top.
    # NO paging and NO `limit`, and both are safe HERE for a reason worth writing down: this is a
    # lookup BY ID, so a chunk of `maxKeysPerCall` keys returns at most that many records, and a
    # cap could only ever truncate. The sibling by-partner producers are TO-MANY, where one
    # prolific partner fills the response and starves the rest of the chunk, so those page.
  maxKeysPerCall: 200
  compute:
    email: "CASE r.email WHEN false THEN null ELSE r.email END"
    phone: "CASE r.phone WHEN false THEN null ELSE r.phone END"
    city: "CASE r.city WHEN false THEN null ELSE r.city END"
    country_id: "CASE r.country_id WHEN false THEN null ELSE r.country_id[0] END"
    country: "CASE r.country_id WHEN false THEN null ELSE r.country_id[1] END"
    website: "CASE r.website WHEN false THEN null ELSE r.website END"
    industry_id: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[0] END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    industry: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[1] END"
    ownerName: "CASE r.user_id WHEN false THEN null ELSE r.user_id[1] END"
    relationship: "CASE WHEN r.customer_rank > 0 THEN 'customer' WHEN r.supplier_rank > 0 THEN 'other' ELSE 'prospect' END"
    sourceUrl: "'http://localhost:8069/odoo/res.partner/' + toString(r.id)"
    parent_id: "CASE r.parent_id WHEN false THEN null ELSE r.parent_id[0] END"
    parentCompanyId: "CASE r.parent_id WHEN false THEN null ELSE (CASE WHEN toString(r.is_company) = 'true' THEN r.parent_id[0] ELSE null END) END"
    commercialPartnerId: "CASE r.commercial_partner_id WHEN false THEN null ELSE r.commercial_partner_id[0] END"
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: email, op: EQUALS, argPath: "domain.-", clause: ["email", "=", "{value}"] }
    - { property: email, op: CONTAINS, argPath: "domain.-", clause: ["email", "ilike", "{value}"], match: ci }
    - { property: email, op: IN, argPath: "domain.-", clause: ["email", "in", "{values}"] }
    - { property: city, op: EQUALS, argPath: "domain.-", clause: ["city", "=", "{value}"] }
    - { property: city, op: CONTAINS, argPath: "domain.-", clause: ["city", "ilike", "{value}"], match: ci }
    - { property: website, op: EQUALS, argPath: "domain.-", clause: ["website", "=", "{value}"] }
    - { property: website, op: CONTAINS, argPath: "domain.-", clause: ["website", "ilike", "{value}"], match: ci }
    - { property: phone, op: EQUALS, argPath: "domain.-", clause: ["phone", "=", "{value}"] }
    - { property: is_company, op: EQUALS, argPath: "domain.-", clause: ["is_company", "=", "{value}"] }
    - { property: country_id, op: EQUALS, argPath: "domain.-", clause: ["country_id", "=", "{value}"] }
    - { property: country_id, op: IN, argPath: "domain.-", clause: ["country_id", "in", "{values}"] }
    - { property: country, op: EQUALS, argPath: "domain.-", clause: ["country_id.name", "=", "{value}"] }
    - { property: industry_id, op: EQUALS, argPath: "domain.-", clause: ["industry_id", "=", "{value}"] }
    - { property: industry_id, op: IN, argPath: "domain.-", clause: ["industry_id", "in", "{values}"] }
    - { property: industry, op: EQUALS, argPath: "domain.-", clause: ["industry_id.name", "=", "{value}"] }
    - { property: user_id, op: EQUALS, argPath: "domain.-", clause: ["user_id", "=", "{value}"] }
    - { property: user_id, op: IN, argPath: "domain.-", clause: ["user_id", "in", "{values}"] }
    - { property: ownerName, op: EQUALS, argPath: "domain.-", clause: ["user_id.name", "=", "{value}"] }
    - { property: parent_id, op: EQUALS, argPath: "domain.-", clause: ["parent_id", "=", "{value}"] }
    - { property: parent_id, op: IN, argPath: "domain.-", clause: ["parent_id", "in", "{values}"] }
    - { property: relationship, op: EQUALS, argPath: "domain.-", clause: ["customer_rank", ">", 0], valuePattern: '^(customer)$' }
  cache: { kind: ttl, seconds: 900, negativeTtlSeconds: 900 }

# A customer's UNPAID posted customer invoices. Keyed on partner_id; the not_paid/partial
# filter is the producer's judgment call and is stated here, where a reviewer can see it.
# Batched: each invoice carries the partner it is made out to, and `partner_id in [...]` returns
# only invoices whose partner is one of the keys, so `partnerKey` is computed from the record
# rather than echoed — an echo would have cost one call per customer.
- name: unpaidInvoicesByPartner
  kind: api
  # Odoo domain values are TYPED: partner_id in ["9"] matches nothing, silently.
  keyType: int
  operation: invoicesSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  args:
    domain:
      - ["partner_id", "in", []]
      - ["move_type", "=", "out_invoice"]
      - ["state", "=", "posted"]
      - ["payment_state", "in", ["not_paid", "partial"]]
    fields: [name, partner_id, amount_total, amount_residual, invoice_date, invoice_date_due, payment_state, currency_id]
    # No `load: ""`: the currency's code comes only inside its pair (see the top of this file).
    order: "amount_residual desc, id desc"
    limit: 1000
  compute:
    partner_id: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    partnerKey: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    invoice_date: "CASE r.invoice_date WHEN false THEN null ELSE r.invoice_date END"
    invoice_date_due: "CASE r.invoice_date_due WHEN false THEN null ELSE r.invoice_date_due END"
    payment_state: "CASE r.payment_state WHEN false THEN null ELSE r.payment_state END"
    currency_id: "CASE r.currency_id WHEN false THEN null ELSE r.currency_id[0] END"
    currency: "CASE r.currency_id WHEN false THEN null ELSE r.currency_id[1] END"
    sourceUrl: "'http://localhost:8069/odoo/account.move/' + toString(r.id)"
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: partner_id, op: EQUALS, argPath: "domain.-", clause: ["partner_id", "=", "{value}"] }
    - { property: partner_id, op: IN, argPath: "domain.-", clause: ["partner_id", "in", "{values}"] }
    - { property: payment_state, op: EQUALS, argPath: "domain.-", clause: ["payment_state", "=", "{value}"] }
    - { property: payment_state, op: IN, argPath: "domain.-", clause: ["payment_state", "in", "{values}"] }
    - { property: currency, op: EQUALS, argPath: "domain.-", clause: ["currency_id.name", "=", "{value}"] }
    - { property: amount_total, op: GREATER_THAN, argPath: "domain.-", clause: ["amount_total", ">", "{value}"] }
    - { property: amount_total, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_total", ">=", "{value}"] }
    - { property: amount_total, op: LESS_THAN, argPath: "domain.-", clause: ["amount_total", "<", "{value}"] }
    - { property: amount_total, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_total", "<=", "{value}"] }
    - { property: amount_residual, op: GREATER_THAN, argPath: "domain.-", clause: ["amount_residual", ">", "{value}"] }
    - { property: amount_residual, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_residual", ">=", "{value}"] }
    - { property: amount_residual, op: LESS_THAN, argPath: "domain.-", clause: ["amount_residual", "<", "{value}"] }
    - { property: amount_residual, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_residual", "<=", "{value}"] }
    - { property: invoice_date, op: GREATER_THAN, argPath: "domain.-", clause: ["invoice_date", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["invoice_date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date, op: LESS_THAN, argPath: "domain.-", clause: ["invoice_date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["invoice_date", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date_due, op: GREATER_THAN, argPath: "domain.-", clause: ["invoice_date_due", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date_due, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["invoice_date_due", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date_due, op: LESS_THAN, argPath: "domain.-", clause: ["invoice_date_due", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date_due, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["invoice_date_due", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
  # BATCHED AND TO-MANY: `limit` bounds the WHOLE response, not each key, so the chunk is paged
  # out in full; Odoo pages by absolute offset.
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  maxKeysPerCall: 200
  # Per customer as numbers: one read_group per measure, grouped by partner, for every key at once.
  aggregates:
    - measure: count
      operation: invoicesReadGroup
      args:
        domain:
          - ["partner_id", "in", []]
          - ["move_type", "=", "out_invoice"]
          - ["state", "=", "posted"]
          - ["payment_state", "in", ["not_paid", "partial"]]
        fields: ["amount_residual:sum"]
        groupby: [partner_id]
      records: "$[*]"
      valueField: partner_id_count
      keyField: partnerKey
    - measure: sum
      of: amount_residual
      operation: invoicesReadGroup
      args:
        domain:
          - ["partner_id", "in", []]
          - ["move_type", "=", "out_invoice"]
          - ["state", "=", "posted"]
          - ["payment_state", "in", ["not_paid", "partial"]]
        fields: ["amount_residual:sum"]
        groupby: [partner_id]
      records: "$[*]"
      valueField: amount_residual
      keyField: partnerKey
    - measure: sum
      of: amount_total
      operation: invoicesReadGroup
      args:
        domain:
          - ["partner_id", "in", []]
          - ["move_type", "=", "out_invoice"]
          - ["state", "=", "posted"]
          - ["payment_state", "in", ["not_paid", "partial"]]
        fields: ["amount_total:sum"]
        groupby: [partner_id]
      records: "$[*]"
      valueField: amount_total
      keyField: partnerKey
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

# A customer's sales orders, any state — the state field rides on the record so a query can
# filter for quotations that stalled versus orders in flight. Batched for the same reason as
# unpaidInvoicesByPartner.
- name: ordersByPartner
  kind: api
  # Odoo domain values are TYPED: partner_id in ["9"] matches nothing, silently.
  keyType: int
  operation: ordersSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  args:
    domain:
      - ["partner_id", "in", []]
    fields: [name, partner_id, amount_total, state, date_order, currency_id]
    # No `load: ""`: the currency's code comes only inside its pair.
    order: "date_order desc, id desc"
    limit: 1000
  compute:
    partner_id: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    partnerKey: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    state: "CASE r.state WHEN false THEN null ELSE r.state END"
    date_order: "CASE r.date_order WHEN false THEN null ELSE r.date_order END"
    currency: "CASE r.currency_id WHEN false THEN null ELSE r.currency_id[1] END"
    sourceUrl: "'http://localhost:8069/odoo/sale.order/' + toString(r.id)"
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: state, op: EQUALS, argPath: "domain.-", clause: ["state", "=", "{value}"] }
    - { property: state, op: IN, argPath: "domain.-", clause: ["state", "in", "{values}"] }
    - { property: amount_total, op: GREATER_THAN, argPath: "domain.-", clause: ["amount_total", ">", "{value}"] }
    - { property: amount_total, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_total", ">=", "{value}"] }
    - { property: amount_total, op: LESS_THAN, argPath: "domain.-", clause: ["amount_total", "<", "{value}"] }
    - { property: amount_total, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_total", "<=", "{value}"] }
    - { property: date_order, op: GREATER_THAN, argPath: "domain.-", clause: ["date_order", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date_order, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_order", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_order, op: LESS_THAN, argPath: "domain.-", clause: ["date_order", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_order, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_order", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  maxKeysPerCall: 200
  # Per customer as numbers: one read_group per measure, grouped by partner, for every key at once.
  aggregates:
    - measure: count
      operation: ordersReadGroup
      args:
        domain:
          - ["partner_id", "in", []]
        fields: ["amount_total:sum"]
        groupby: [partner_id]
      records: "$[*]"
      valueField: partner_id_count
      keyField: partnerKey
    - measure: sum
      of: amount_total
      operation: ordersReadGroup
      args:
        domain:
          - ["partner_id", "in", []]
        fields: ["amount_total:sum"]
        groupby: [partner_id]
      records: "$[*]"
      valueField: amount_total
      keyField: partnerKey
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

# ── The book doors: fetch-all producers behind the OdooBook anchor, so questions about
# the SETS ("how many customers", "who owes most") need no stage literal nobody can know.
# The anchor key rides in Odoo's free-form context kwarg — the only safe slot, since JSON-2
# binds kwargs against the method signature and rejects strangers.
#
# Odoo pages by absolute OFFSET, not page number: `limit` is the page size and `offset` skips
# records already read. Without paging a door made one call and returned `limit` rows —
# indistinguishable from a book that small, which is how 500 of 1,344 customers was once reported
# as an exact figure. maxPages bounds the walk; hitting it warns. A page is 1,000 records: Odoo's
# cost is per record, not per call, so a bigger page is fewer round trips and no slower.

- name: customersAll
  kind: api
  operation: partnersSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      - ["customer_rank", ">", 0]
    # website rides along for the Diffbot bridge — see customersById.
    fields: [name, email, phone, city, country_id, is_company, website, parent_id, commercial_partner_id, industry_id, user_id, customer_rank, supplier_rank]
    # No `load: ""` here, unlike every other door: see THE PARTNER DOORS at the top.
    limit: 1000
  compute:
    email: "CASE r.email WHEN false THEN null ELSE r.email END"
    phone: "CASE r.phone WHEN false THEN null ELSE r.phone END"
    city: "CASE r.city WHEN false THEN null ELSE r.city END"
    country_id: "CASE r.country_id WHEN false THEN null ELSE r.country_id[0] END"
    country: "CASE r.country_id WHEN false THEN null ELSE r.country_id[1] END"
    website: "CASE r.website WHEN false THEN null ELSE r.website END"
    industry_id: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[0] END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    industry: "CASE r.industry_id WHEN false THEN null ELSE r.industry_id[1] END"
    ownerName: "CASE r.user_id WHEN false THEN null ELSE r.user_id[1] END"
    relationship: "CASE WHEN r.customer_rank > 0 THEN 'customer' WHEN r.supplier_rank > 0 THEN 'other' ELSE 'prospect' END"
    sourceUrl: "'http://localhost:8069/odoo/res.partner/' + toString(r.id)"
    parent_id: "CASE r.parent_id WHEN false THEN null ELSE r.parent_id[0] END"
    parentCompanyId: "CASE r.parent_id WHEN false THEN null ELSE (CASE WHEN toString(r.is_company) = 'true' THEN r.parent_id[0] ELSE null END) END"
    commercialPartnerId: "CASE r.commercial_partner_id WHEN false THEN null ELSE r.commercial_partner_id[0] END"
  # Declaring these buys two different things, and the second is the one that is easy to miss:
  #
  #   1. the source filters, so the walk is over matching rows instead of the whole book;
  #   2. a `LIMIT` can be pushed and a hop bounded, because nothing is left for the graph to drop.
  #
  # A single company by name or id is therefore ONE call, whatever the size of the book.
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: email, op: EQUALS, argPath: "domain.-", clause: ["email", "=", "{value}"] }
    - { property: email, op: CONTAINS, argPath: "domain.-", clause: ["email", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: email, op: IN, argPath: "domain.-", clause: ["email", "in", "{values}"] }
    - { property: city, op: EQUALS, argPath: "domain.-", clause: ["city", "=", "{value}"] }
    - { property: city, op: CONTAINS, argPath: "domain.-", clause: ["city", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: website, op: EQUALS, argPath: "domain.-", clause: ["website", "=", "{value}"] }
    - { property: website, op: CONTAINS, argPath: "domain.-", clause: ["website", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: phone, op: EQUALS, argPath: "domain.-", clause: ["phone", "=", "{value}"] }
    - { property: is_company, op: EQUALS, argPath: "domain.-", clause: ["is_company", "=", "{value}"] }
    - { property: country_id, op: EQUALS, argPath: "domain.-", clause: ["country_id", "=", "{value}"] }
    - { property: country_id, op: IN, argPath: "domain.-", clause: ["country_id", "in", "{values}"] }
    - { property: country, op: EQUALS, argPath: "domain.-", clause: ["country_id.name", "=", "{value}"] }
    - { property: industry_id, op: EQUALS, argPath: "domain.-", clause: ["industry_id", "=", "{value}"] }
    - { property: industry_id, op: IN, argPath: "domain.-", clause: ["industry_id", "in", "{values}"] }
    - { property: industry, op: EQUALS, argPath: "domain.-", clause: ["industry_id.name", "=", "{value}"] }
    - { property: user_id, op: EQUALS, argPath: "domain.-", clause: ["user_id", "=", "{value}"] }
    - { property: user_id, op: IN, argPath: "domain.-", clause: ["user_id", "in", "{values}"] }
    - { property: ownerName, op: EQUALS, argPath: "domain.-", clause: ["user_id.name", "=", "{value}"] }
    - { property: parent_id, op: EQUALS, argPath: "domain.-", clause: ["parent_id", "=", "{value}"] }
    - { property: parent_id, op: IN, argPath: "domain.-", clause: ["parent_id", "in", "{values}"] }
    - { property: relationship, op: EQUALS, argPath: "domain.-", clause: ["customer_rank", ">", 0], valuePattern: '^(customer)$' }
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  # HOW MANY CUSTOMERS: one search_count over the door's own domain, not a walk of the book.
  # Exact under every rule above — each is an Odoo `=`, `in`, `>` or `ilike` the graph would
  # apply the same way — with two exceptions the engine and the rules handle: a CONTAINS written
  # case-sensitively is read from the records (`match: ci`), and a fragment holding `%`, `_` or
  # `\` is filtered in the graph (`valuePattern`), since `ilike` reads them as specials.
  aggregates:
    - measure: count
      operation: partnersSearchCount
      args:
        domain:
          - ["customer_rank", ">", 0]
      valueField: "$"
      keyField: scopeKey
  cache: { kind: ttl, seconds: 900, negativeTtlSeconds: 900 }

- name: invoicesUnpaidAll
  kind: api
  operation: invoicesSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      - ["move_type", "=", "out_invoice"]
      - ["state", "=", "posted"]
      - ["payment_state", "in", ["not_paid", "partial"]]
    fields: [name, partner_id, amount_total, amount_residual, invoice_date, invoice_date_due, payment_state, currency_id]
    # No `load: ""`: the currency's code comes only inside its pair.
    order: "amount_residual desc, id desc"
    limit: 1000
  compute:
    partner_id: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    partnerKey: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    invoice_date: "CASE r.invoice_date WHEN false THEN null ELSE r.invoice_date END"
    invoice_date_due: "CASE r.invoice_date_due WHEN false THEN null ELSE r.invoice_date_due END"
    payment_state: "CASE r.payment_state WHEN false THEN null ELSE r.payment_state END"
    currency_id: "CASE r.currency_id WHEN false THEN null ELSE r.currency_id[0] END"
    currency: "CASE r.currency_id WHEN false THEN null ELSE r.currency_id[1] END"
    sourceUrl: "'http://localhost:8069/odoo/account.move/' + toString(r.id)"
    # An ungrouped read_group over nothing answers `false` for a sum, not 0. Only an aggregate row
    # can carry it — an invoice always has its amounts — and as null the sum ignores it.
    amount_residual: "CASE r.amount_residual WHEN false THEN null ELSE r.amount_residual END"
    amount_total: "CASE r.amount_total WHEN false THEN null ELSE r.amount_total END"
  # Largest debt first, and said so: "the 10 biggest outstanding invoices" is the first page.
  orderedBy: [{ property: amount_residual, descending: true }]
  # The money and due-date filters are the ones the receivables views actually write, and they
  # were the most expensive to leave graph-side: "everything owing over X" read every unpaid
  # invoice in the book to drop most of them afterwards.
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: partner_id, op: EQUALS, argPath: "domain.-", clause: ["partner_id", "=", "{value}"] }
    - { property: partner_id, op: IN, argPath: "domain.-", clause: ["partner_id", "in", "{values}"] }
    - { property: payment_state, op: EQUALS, argPath: "domain.-", clause: ["payment_state", "=", "{value}"] }
    - { property: payment_state, op: IN, argPath: "domain.-", clause: ["payment_state", "in", "{values}"] }
    - { property: currency, op: EQUALS, argPath: "domain.-", clause: ["currency_id.name", "=", "{value}"] }
    - { property: amount_total, op: GREATER_THAN, argPath: "domain.-", clause: ["amount_total", ">", "{value}"] }
    - { property: amount_total, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_total", ">=", "{value}"] }
    - { property: amount_total, op: LESS_THAN, argPath: "domain.-", clause: ["amount_total", "<", "{value}"] }
    - { property: amount_total, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_total", "<=", "{value}"] }
    - { property: amount_residual, op: GREATER_THAN, argPath: "domain.-", clause: ["amount_residual", ">", "{value}"] }
    - { property: amount_residual, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_residual", ">=", "{value}"] }
    - { property: amount_residual, op: LESS_THAN, argPath: "domain.-", clause: ["amount_residual", "<", "{value}"] }
    - { property: amount_residual, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_residual", "<=", "{value}"] }
    - { property: invoice_date, op: GREATER_THAN, argPath: "domain.-", clause: ["invoice_date", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["invoice_date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date, op: LESS_THAN, argPath: "domain.-", clause: ["invoice_date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["invoice_date", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date_due, op: GREATER_THAN, argPath: "domain.-", clause: ["invoice_date_due", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date_due, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["invoice_date_due", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date_due, op: LESS_THAN, argPath: "domain.-", clause: ["invoice_date_due", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: invoice_date_due, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["invoice_date_due", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
  # The book's receivables as numbers: one search_count, one read_group over the whole domain.
  aggregates:
    - measure: count
      operation: invoicesSearchCount
      args:
        domain:
          - ["move_type", "=", "out_invoice"]
          - ["state", "=", "posted"]
          - ["payment_state", "in", ["not_paid", "partial"]]
      valueField: "$"
      keyField: scopeKey
    - measure: sum
      of: amount_residual
      operation: invoicesReadGroup
      args:
        domain:
          - ["move_type", "=", "out_invoice"]
          - ["state", "=", "posted"]
          - ["payment_state", "in", ["not_paid", "partial"]]
        fields: ["amount_residual:sum"]
        groupby: []
      records: "$[*]"
      valueField: amount_residual
      keyField: scopeKey
    - measure: sum
      of: amount_total
      operation: invoicesReadGroup
      args:
        domain:
          - ["move_type", "=", "out_invoice"]
          - ["state", "=", "posted"]
          - ["payment_state", "in", ["not_paid", "partial"]]
        fields: ["amount_total:sum"]
        groupby: []
      records: "$[*]"
      valueField: amount_total
      keyField: scopeKey
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

- name: leadsOpenAll
  kind: api
  operation: leadsSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      - ["active", "=", true]
      - ["probability", "<", 100]
      # Partnerless leads excluded here for the same falsy-key reason as leadsByStage:
      # their partner_id is FALSE, and false inside a downstream integer batch breaks it.
      - ["partner_id", "!=", false]
    fields: [name, partner_id, expected_revenue, probability, email_from, stage_id, create_date, date_closed, date_last_stage_update, won_status, date_deadline, user_id, active, company_currency, type, priority]
    # No `load: ""`: a lead door is a PARTNER-DOOR shape (see the top of this file).
    order: "expected_revenue desc, id desc"
    limit: 1000
  compute:
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    partner_id: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    email_from: "CASE r.email_from WHEN false THEN null ELSE r.email_from END"
    stage_id: "CASE r.stage_id WHEN false THEN null ELSE r.stage_id[0] END"
    create_date: "CASE r.create_date WHEN false THEN null ELSE r.create_date END"
    date_closed: "CASE r.date_closed WHEN false THEN null ELSE r.date_closed END"
    date_last_stage_update: "CASE r.date_last_stage_update WHEN false THEN null ELSE r.date_last_stage_update END"
    won_status: "CASE r.won_status WHEN false THEN null ELSE r.won_status END"
    date_deadline: "CASE r.date_deadline WHEN false THEN null ELSE r.date_deadline END"
    type: "CASE r.type WHEN false THEN null ELSE r.type END"
    # The vocabulary's Opportunity — see leadsByStage.
    title: "r.name"
    stage: "CASE r.stage_id WHEN false THEN null ELSE r.stage_id[1] END"
    ownerName: "CASE r.user_id WHEN false THEN null ELSE r.user_id[1] END"
    currency: "CASE r.company_currency WHEN false THEN null ELSE r.company_currency[1] END"
    sourceUrl: "'http://localhost:8069/odoo/crm.lead/' + toString(r.id)"
    status: "CASE r.won_status WHEN 'pending' THEN 'open' WHEN 'won' THEN 'won' WHEN 'lost' THEN 'lost' ELSE null END"
    amount: "toFloat(r.expected_revenue)"
    probabilityPercent: "toFloat(r.probability)"
    probability: "toFloat(r.probability) / 100.0"
    priorityLabel: "CASE r.priority WHEN '0' THEN 'low' WHEN '1' THEN 'medium' WHEN '2' THEN 'high' WHEN '3' THEN 'very_high' ELSE null END"
    closeOn: "CASE r.won_status WHEN 'pending' THEN (CASE r.date_deadline WHEN false THEN null ELSE r.date_deadline END) ELSE (CASE r.date_closed WHEN false THEN null ELSE substring(r.date_closed, 0, 10) END) END"
  # Biggest first: the triage view's top 50 and the pipeline view's top 100 are the first page.
  orderedBy: [{ property: expected_revenue, descending: true }]
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: title, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: title, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci }
    - { property: partner_id, op: EQUALS, argPath: "domain.-", clause: ["partner_id", "=", "{value}"] }
    - { property: partner_id, op: IN, argPath: "domain.-", clause: ["partner_id", "in", "{values}"] }
    - { property: stage, op: EQUALS, argPath: "domain.-", clause: ["stage_id.name", "=", "{value}"] }
    - { property: stage, op: IN, argPath: "domain.-", clause: ["stage_id.name", "in", "{values}"] }
    - { property: stage_id, op: EQUALS, argPath: "domain.-", clause: ["stage_id", "=", "{value}"] }
    - { property: stage_id, op: IN, argPath: "domain.-", clause: ["stage_id", "in", "{values}"] }
    - { property: won_status, op: EQUALS, argPath: "domain.-", clause: ["won_status", "=", "{value}"] }
    - { property: won_status, op: IN, argPath: "domain.-", clause: ["won_status", "in", "{values}"] }
    - { property: status, op: EQUALS, argPath: "domain.-", clause: ["won_status", "=", "pending"], valuePattern: '^(open)$' }
    - { property: active, op: EQUALS, argPath: "domain.-", clause: ["active", "=", "{value}"] }
    - { property: type, op: EQUALS, argPath: "domain.-", clause: ["type", "=", "{value}"] }
    - { property: user_id, op: EQUALS, argPath: "domain.-", clause: ["user_id", "=", "{value}"] }
    - { property: user_id, op: IN, argPath: "domain.-", clause: ["user_id", "in", "{values}"] }
    - { property: ownerName, op: EQUALS, argPath: "domain.-", clause: ["user_id.name", "=", "{value}"] }
    - { property: email_from, op: EQUALS, argPath: "domain.-", clause: ["email_from", "=", "{value}"] }
    - { property: email_from, op: CONTAINS, argPath: "domain.-", clause: ["email_from", "ilike", "{value}"], match: ci }
    - { property: probabilityPercent, op: GREATER_THAN, argPath: "domain.-", clause: ["probability", ">", "{value}"] }
    - { property: probabilityPercent, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["probability", ">=", "{value}"] }
    - { property: probabilityPercent, op: LESS_THAN, argPath: "domain.-", clause: ["probability", "<", "{value}"] }
    - { property: probabilityPercent, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["probability", "<=", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN, argPath: "domain.-", clause: ["expected_revenue", ">", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", ">=", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN, argPath: "domain.-", clause: ["expected_revenue", "<", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", "<=", "{value}"] }
    - { property: amount, op: GREATER_THAN, argPath: "domain.-", clause: ["expected_revenue", ">", "{value}"] }
    - { property: amount, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", ">=", "{value}"] }
    - { property: amount, op: LESS_THAN, argPath: "domain.-", clause: ["expected_revenue", "<", "{value}"] }
    - { property: amount, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", "<=", "{value}"] }
    - { property: create_date, op: GREATER_THAN, argPath: "domain.-", clause: ["create_date", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: create_date, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["create_date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: create_date, op: LESS_THAN, argPath: "domain.-", clause: ["create_date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: create_date, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["create_date", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: GREATER_THAN, argPath: "domain.-", clause: ["date_closed", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date_closed, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: LESS_THAN, argPath: "domain.-", clause: ["date_closed", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: GREATER_THAN, argPath: "domain.-", clause: ["date_last_stage_update", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date_last_stage_update, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_last_stage_update", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: LESS_THAN, argPath: "domain.-", clause: ["date_last_stage_update", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_last_stage_update", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_deadline, op: GREATER_THAN, argPath: "domain.-", clause: ["date_deadline", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_deadline", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: LESS_THAN, argPath: "domain.-", clause: ["date_deadline", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_deadline", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

# EVERY opportunity on the book — open, won and lost. The sibling `leadsOpenAll` is the
# PIPELINE door and filters to what is still in play; at 2,000 deals it sees 1,200, so a
# per-account question that wants won/lost counts cannot be answered through it. Verified
# against the live book: 2,000 all / 1,200 open, with won_status in pending|won|lost.
#
# Odoo hides archived records by default and marks a LOST deal by archiving it, so the
# `active` OR is what makes closed deals visible at all. Prefix notation: `|` applies to
# the two terms that follow it; the rest of the list is ANDed, which is also why an
# appended pushdown clause lands correctly.
- name: leadsAll
  kind: api
  operation: leadsSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      - "|"
      - ["active", "=", true]
      - ["active", "=", false]
      # Partnerless leads excluded for the same falsy-key reason as leadsByStage.
      - ["partner_id", "!=", false]
    fields: [name, partner_id, expected_revenue, probability, email_from, stage_id, create_date, date_closed, date_last_stage_update, won_status, date_deadline, user_id, active, company_currency, type, priority]
    # No `load: ""`: a lead door is a PARTNER-DOOR shape (see the top of this file).
    limit: 1000
  compute:
    partner_id: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    email_from: "CASE r.email_from WHEN false THEN null ELSE r.email_from END"
    stage_id: "CASE r.stage_id WHEN false THEN null ELSE r.stage_id[0] END"
    create_date: "CASE r.create_date WHEN false THEN null ELSE r.create_date END"
    date_closed: "CASE r.date_closed WHEN false THEN null ELSE r.date_closed END"
    date_last_stage_update: "CASE r.date_last_stage_update WHEN false THEN null ELSE r.date_last_stage_update END"
    won_status: "CASE r.won_status WHEN false THEN null ELSE r.won_status END"
    date_deadline: "CASE r.date_deadline WHEN false THEN null ELSE r.date_deadline END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    type: "CASE r.type WHEN false THEN null ELSE r.type END"
    # The vocabulary's Opportunity — see leadsByStage.
    title: "r.name"
    stage: "CASE r.stage_id WHEN false THEN null ELSE r.stage_id[1] END"
    ownerName: "CASE r.user_id WHEN false THEN null ELSE r.user_id[1] END"
    currency: "CASE r.company_currency WHEN false THEN null ELSE r.company_currency[1] END"
    sourceUrl: "'http://localhost:8069/odoo/crm.lead/' + toString(r.id)"
    status: "CASE r.won_status WHEN 'pending' THEN 'open' WHEN 'won' THEN 'won' WHEN 'lost' THEN 'lost' ELSE null END"
    # An ungrouped read_group over nothing answers `false` for a sum; as null the sum ignores it.
    expected_revenue: "CASE r.expected_revenue WHEN false THEN null ELSE r.expected_revenue END"
    amount: "toFloat(CASE r.expected_revenue WHEN false THEN null ELSE r.expected_revenue END)"
    probabilityPercent: "toFloat(r.probability)"
    probability: "toFloat(r.probability) / 100.0"
    priorityLabel: "CASE r.priority WHEN '0' THEN 'low' WHEN '1' THEN 'medium' WHEN '2' THEN 'high' WHEN '3' THEN 'very_high' ELSE null END"
    closeOn: "CASE r.won_status WHEN 'pending' THEN (CASE r.date_deadline WHEN false THEN null ELSE r.date_deadline END) ELSE (CASE r.date_closed WHEN false THEN null ELSE substring(r.date_closed, 0, 10) END) END"
  # 1,000 a page: the book's 2,000 leads are three round trips, not eleven. It does NOT make the
  # sweep faster — measured 2026-09-23 it is ~10 s either way, because Odoo's search_read cost is
  # per record (the fields list, partner_id resolution), not per call. Fewer calls is all it buys.
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 50 }
  # Every filter a deal question writes — status, stage, owner, window — narrows the read here.
  pushdown:
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: title, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: title, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: partner_id, op: EQUALS, argPath: "domain.-", clause: ["partner_id", "=", "{value}"] }
    - { property: partner_id, op: IN, argPath: "domain.-", clause: ["partner_id", "in", "{values}"] }
    - { property: stage, op: EQUALS, argPath: "domain.-", clause: ["stage_id.name", "=", "{value}"] }
    - { property: stage, op: IN, argPath: "domain.-", clause: ["stage_id.name", "in", "{values}"] }
    - { property: stage_id, op: EQUALS, argPath: "domain.-", clause: ["stage_id", "=", "{value}"] }
    - { property: stage_id, op: IN, argPath: "domain.-", clause: ["stage_id", "in", "{values}"] }
    - { property: won_status, op: EQUALS, argPath: "domain.-", clause: ["won_status", "=", "{value}"] }
    - { property: won_status, op: IN, argPath: "domain.-", clause: ["won_status", "in", "{values}"] }
    - { property: status, op: EQUALS, argPath: "domain.-", clause: ["won_status", "=", "{value}"], valuePattern: '^(won|lost)$' }
    - { property: active, op: EQUALS, argPath: "domain.-", clause: ["active", "=", "{value}"] }
    - { property: type, op: EQUALS, argPath: "domain.-", clause: ["type", "=", "{value}"] }
    - { property: user_id, op: EQUALS, argPath: "domain.-", clause: ["user_id", "=", "{value}"] }
    - { property: user_id, op: IN, argPath: "domain.-", clause: ["user_id", "in", "{values}"] }
    - { property: ownerName, op: EQUALS, argPath: "domain.-", clause: ["user_id.name", "=", "{value}"] }
    - { property: email_from, op: EQUALS, argPath: "domain.-", clause: ["email_from", "=", "{value}"] }
    - { property: email_from, op: CONTAINS, argPath: "domain.-", clause: ["email_from", "ilike", "{value}"], match: ci, valuePattern: '^([^%_\\]*)$' }
    - { property: probabilityPercent, op: GREATER_THAN, argPath: "domain.-", clause: ["probability", ">", "{value}"] }
    - { property: probabilityPercent, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["probability", ">=", "{value}"] }
    - { property: probabilityPercent, op: LESS_THAN, argPath: "domain.-", clause: ["probability", "<", "{value}"] }
    - { property: probabilityPercent, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["probability", "<=", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN, argPath: "domain.-", clause: ["expected_revenue", ">", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", ">=", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN, argPath: "domain.-", clause: ["expected_revenue", "<", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", "<=", "{value}"] }
    - { property: amount, op: GREATER_THAN, argPath: "domain.-", clause: ["expected_revenue", ">", "{value}"] }
    - { property: amount, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", ">=", "{value}"] }
    - { property: amount, op: LESS_THAN, argPath: "domain.-", clause: ["expected_revenue", "<", "{value}"] }
    - { property: amount, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", "<=", "{value}"] }
    - { property: create_date, op: GREATER_THAN, argPath: "domain.-", clause: ["create_date", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: create_date, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["create_date", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: create_date, op: LESS_THAN, argPath: "domain.-", clause: ["create_date", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: create_date, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["create_date", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: GREATER_THAN, argPath: "domain.-", clause: ["date_closed", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date_closed, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: LESS_THAN, argPath: "domain.-", clause: ["date_closed", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_closed, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: GREATER_THAN, argPath: "domain.-", clause: ["date_last_stage_update", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})$' }
    - { property: date_last_stage_update, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_last_stage_update", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: LESS_THAN, argPath: "domain.-", clause: ["date_last_stage_update", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_last_stage_update, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_last_stage_update", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?)$' }
    - { property: date_deadline, op: GREATER_THAN, argPath: "domain.-", clause: ["date_deadline", ">", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_deadline", ">=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: LESS_THAN, argPath: "domain.-", clause: ["date_deadline", "<", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
    - { property: date_deadline, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_deadline", "<=", "{value}"], valuePattern: '^(\d{4}-\d{2}-\d{2})$' }
  # The book's deals as numbers: how many is one search_count, how much one ungrouped read_group.
  aggregates:
    - measure: count
      operation: leadsSearchCount
      args:
        domain:
          - "|"
          - ["active", "=", true]
          - ["active", "=", false]
          - ["partner_id", "!=", false]
      valueField: "$"
      keyField: scopeKey
    - measure: sum
      of: expected_revenue
      operation: leadsReadGroup
      args:
        domain:
          - "|"
          - ["active", "=", true]
          - ["active", "=", false]
          - ["partner_id", "!=", false]
        fields: ["expected_revenue:sum"]
        groupby: []
      records: "$[*]"
      valueField: expected_revenue
      keyField: scopeKey
    - measure: sum
      of: amount
      operation: leadsReadGroup
      args:
        domain:
          - "|"
          - ["active", "=", true]
          - ["active", "=", false]
          - ["partner_id", "!=", false]
        fields: ["expected_revenue:sum"]
        groupby: []
      records: "$[*]"
      valueField: amount
      keyField: scopeKey
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

# THE DECIDED DEALS — won or lost, archived or not. A decided deal almost never changes again,
# so this door holds its read for an hour where the pipeline doors hold theirs for five minutes,
# and the wins and losses questions ("biggest win this quarter", "what did we lose to") read it
# instead of re-reading the whole book. Reopening a deal in Odoo moves it back to the pipeline;
# this door sees that within the hour.
#
# Only here is `closeOn` the day of `date_closed` on EVERY record, so only here can a window on
# closeOn be pushed as a window on date_closed — exactly, to the second.
- name: leadsDecidedAll
  kind: api
  operation: leadsSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      - "|"
      - ["active", "=", true]
      - ["active", "=", false]
      - ["won_status", "in", ["won", "lost"]]
      # Partnerless leads excluded for the same falsy-key reason as leadsByStage.
      - ["partner_id", "!=", false]
    fields: [name, partner_id, expected_revenue, probability, email_from, stage_id, create_date, date_closed, date_last_stage_update, won_status, date_deadline, user_id, active, company_currency, type, priority, lost_reason_id]
    order: "date_closed desc, id desc"
    limit: 1000
  compute:
    partner_id: "CASE r.partner_id WHEN false THEN null ELSE r.partner_id[0] END"
    email_from: "CASE r.email_from WHEN false THEN null ELSE r.email_from END"
    stage_id: "CASE r.stage_id WHEN false THEN null ELSE r.stage_id[0] END"
    create_date: "CASE r.create_date WHEN false THEN null ELSE r.create_date END"
    date_closed: "CASE r.date_closed WHEN false THEN null ELSE r.date_closed END"
    date_last_stage_update: "CASE r.date_last_stage_update WHEN false THEN null ELSE r.date_last_stage_update END"
    won_status: "CASE r.won_status WHEN false THEN null ELSE r.won_status END"
    date_deadline: "CASE r.date_deadline WHEN false THEN null ELSE r.date_deadline END"
    user_id: "CASE r.user_id WHEN false THEN null ELSE r.user_id[0] END"
    type: "CASE r.type WHEN false THEN null ELSE r.type END"
    lostReason: "CASE r.lost_reason_id WHEN false THEN null ELSE r.lost_reason_id[1] END"
