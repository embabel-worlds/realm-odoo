# All four producers speak to Odoo's MIDDLE TIER — search_read through JSON-2 — never the
# database. `load: ""` is load-bearing on every one: it makes many2one fields come back as bare
# ids, which is what the joins key on; without it partner_id arrives as an [id, name] pair and
# every traversal silently matches nothing.

# Open pipeline by stage NAME — the scan door. The anchor key (a stage name, e.g.
# 'Proposition') is injected into the domain's IN list; echoed back so records join to the
# anchor that asked.
- name: leadsByStage
  kind: api
  operation: leadsSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  echoKeyAs: stageKey
  args:
    domain:
      - ["stage_id.name", "in", []]
      - ["active", "=", true]
      # Odoo spells "no partner" as FALSE, not null, and a false key in the batched
      # LEAD_OF traversal arrives at Postgres as the string 'false' inside an integer
      # IN-list — a 500. Until the engine drops falsy join keys, this door carries
      # only partnered leads; the trade is stated here rather than discovered.
      - ["partner_id", "!=", false]
    fields: [name, partner_id, expected_revenue, probability, email_from, stage_id, create_date, date_closed]
    load: ""
    limit: 200
  cache: { kind: ttl, seconds: 300 }

# Customers by id — resolves a lead's partner_id (bare id, thanks to load:"") to the partner
# record. Batch IN, one call for a whole traversal.
- name: customersById
  kind: api
  # Odoo domain values are TYPED: partner_id in ["9"] matches nothing, silently.
  keyType: int
  operation: partnersSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  args:
    domain:
      - ["id", "in", []]
    # website rides along for the Diffbot bridge (types/diffbot.yml): a domain
    # identifies a company and a name does not, and website is Odoo's own field.
    fields: [name, email, phone, city, country_id, is_company, website]
    load: ""
    # NO paging, and that is safe HERE for a reason worth writing down: this is a
    # lookup BY ID, so a chunk of `maxKeysPerCall` (50) keys returns at most 50
    # records — never near this limit. The sibling by-partner producers batch the
    # same way but are TO-MANY, where one prolific partner fills the response and
    # starves the rest of the chunk, so those page. An audit that flags a batched
    # producer with a flat limit is right to; this is the exception, not an oversight.
    limit: 200
  cache: { kind: ttl, seconds: 300 }

# A customer's UNPAID posted customer invoices. Keyed on partner_id; the not_paid/partial
# filter is the producer's judgment call and is stated here, where a reviewer can see it.
- name: unpaidInvoicesByPartner
  kind: api
  # Odoo domain values are TYPED: partner_id in ["9"] matches nothing, silently.
  keyType: int
  operation: invoicesSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  # The echoed key, not the raw partner_id, is what joins attribute on — the same
  # "echo kept for join safety" every shipped API realm relies on.
  echoKeyAs: partnerKey
  args:
    domain:
      - ["partner_id", "in", []]
      - ["move_type", "=", "out_invoice"]
      - ["state", "=", "posted"]
      - ["payment_state", "in", ["not_paid", "partial"]]
    fields: [name, partner_id, amount_total, amount_residual, invoice_date_due, payment_state]
    load: ""
    limit: 200
  cache: { kind: ttl, seconds: 300 }

# A customer's sales orders, any state — the state field rides on the record so a query can
# filter for quotations that stalled versus orders in flight.
- name: ordersByPartner
  kind: api
  # Odoo domain values are TYPED: partner_id in ["9"] matches nothing, silently.
  keyType: int
  operation: ordersSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  echoKeyAs: partnerKey
  args:
    domain:
      - ["partner_id", "in", []]
    fields: [name, partner_id, amount_total, state, date_order]
    load: ""
    limit: 200
  cache: { kind: ttl, seconds: 300 }

# ── The book doors: fetch-all producers behind the OdooBook anchor, so questions about
# the SETS ("how many customers", "who owes most") need no stage literal nobody can know.
# The anchor key rides in Odoo's free-form context kwarg — the only safe slot, since JSON-2
# binds kwargs against the method signature and rejects strangers.

- name: customersAll
  kind: api
  operation: partnersSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      - ["customer_rank", ">", 0]
    # website rides along for the Diffbot bridge — see customersById.
    fields: [name, email, phone, city, is_company, website]
    load: ""
    limit: 200
  # WHAT THE SOURCE ABSORBS DECIDES WHAT THE QUESTION COSTS. An Odoo domain is a list of
  # triples ANDed together, so `domain.-` appends one conjunct and no `linkPrevious` is needed.
  #
  # Declaring these buys two different things, and the second is the one that is easy to miss:
  #
  #   1. the source filters, so the walk is over matching rows instead of the whole book;
  #   2. the engine may ask for a COUNT instead of the records at all. Aggregate pushdown
  #      refuses on ANY residual predicate — what the source will not apply, the graph must,
  #      and a number cannot be filtered after the fact. So an undeclared filter does not just
  #      cost a broader fetch; it makes "how many" unanswerable except by reading every row.
  #
  # Every property below is the name the QUERY writes, which here is also Odoo's own field name
  # because this realm declares no `project:`. The third element is a whole-node `{value}`, so
  # a number reaches Odoo as a number rather than as its digits in quotes.
  pushdown:
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    # Odoo's `ilike` is already substring-and-case-insensitive; it wraps the value itself.
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"] }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: email, op: EQUALS, argPath: "domain.-", clause: ["email", "=", "{value}"] }
    - { property: email, op: CONTAINS, argPath: "domain.-", clause: ["email", "ilike", "{value}"] }
    - { property: email, op: IN, argPath: "domain.-", clause: ["email", "in", "{values}"] }
    - { property: city, op: EQUALS, argPath: "domain.-", clause: ["city", "=", "{value}"] }
    - { property: city, op: CONTAINS, argPath: "domain.-", clause: ["city", "ilike", "{value}"] }
    - { property: website, op: CONTAINS, argPath: "domain.-", clause: ["website", "ilike", "{value}"] }
    - { property: website, op: EQUALS, argPath: "domain.-", clause: ["website", "=", "{value}"] }
    - { property: phone, op: EQUALS, argPath: "domain.-", clause: ["phone", "=", "{value}"] }
    - { property: is_company, op: EQUALS, argPath: "domain.-", clause: ["is_company", "=", "{value}"] }
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
  # Odoo pages by absolute OFFSET, not page number: `limit` is the page size and `offset`
  # skips records already read. Without this the door made one call and returned `limit`
  # rows — indistinguishable from a book that small, which is how 500 of 1,344 customers
  # was reported as an exact figure. maxPages bounds the walk; hitting it warns.
  paging: { style: offset, param: offset, sizeParam: limit, size: 200, maxPages: 10 }
  cache: { kind: ttl, seconds: 300 }

- name: invoicesUnpaidAll
  kind: api
  operation: invoicesSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      - ["move_type", "=", "out_invoice"]
      - ["state", "=", "posted"]
      - ["payment_state", "in", ["not_paid", "partial"]]
    fields: [name, partner_id, amount_total, amount_residual, invoice_date_due, payment_state]
    load: ""
    limit: 200
  # See customersAll. The money and due-date filters are the ones the receivables views actually
  # write, and they were the ones most expensive to leave graph-side: "everything owing over X"
  # read every unpaid invoice in the book to drop most of them afterwards.
  pushdown:
    - { property: partner_id, op: EQUALS, argPath: "domain.-", clause: ["partner_id", "=", "{value}"] }
    - { property: partner_id, op: IN, argPath: "domain.-", clause: ["partner_id", "in", "{values}"] }
    - { property: payment_state, op: EQUALS, argPath: "domain.-", clause: ["payment_state", "=", "{value}"] }
    - { property: payment_state, op: IN, argPath: "domain.-", clause: ["payment_state", "in", "{values}"] }
    - { property: amount_total, op: GREATER_THAN, argPath: "domain.-", clause: ["amount_total", ">", "{value}"] }
    - { property: amount_total, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_total", ">=", "{value}"] }
    - { property: amount_total, op: LESS_THAN, argPath: "domain.-", clause: ["amount_total", "<", "{value}"] }
    - { property: amount_total, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_total", "<=", "{value}"] }
    - { property: amount_residual, op: GREATER_THAN, argPath: "domain.-", clause: ["amount_residual", ">", "{value}"] }
    - { property: amount_residual, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_residual", ">=", "{value}"] }
    - { property: amount_residual, op: LESS_THAN, argPath: "domain.-", clause: ["amount_residual", "<", "{value}"] }
    - { property: amount_residual, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["amount_residual", "<=", "{value}"] }
    - { property: invoice_date_due, op: GREATER_THAN, argPath: "domain.-", clause: ["invoice_date_due", ">", "{value}"] }
    - { property: invoice_date_due, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["invoice_date_due", ">=", "{value}"] }
    - { property: invoice_date_due, op: LESS_THAN, argPath: "domain.-", clause: ["invoice_date_due", "<", "{value}"] }
    - { property: invoice_date_due, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["invoice_date_due", "<=", "{value}"] }
  # Odoo pages by absolute OFFSET, not page number: `limit` is the page size and `offset`
  # skips records already read. Without this the door made one call and returned `limit`
  # rows — indistinguishable from a book that small, which is how 500 of 1,344 customers
  # was reported as an exact figure. maxPages bounds the walk; hitting it warns.
  paging: { style: offset, param: offset, sizeParam: limit, size: 200, maxPages: 10 }
  cache: { kind: ttl, seconds: 300 }

- name: leadsOpenAll
  kind: api
  operation: leadsSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      - ["active", "=", true]
      - ["probability", "<", 100]
      # Partnerless leads excluded here for the same falsy-key reason as leadsByStage:
      # their partner_id is FALSE, and false inside a downstream integer batch breaks it.
      - ["partner_id", "!=", false]
    fields: [name, partner_id, expected_revenue, probability, email_from, stage_id, create_date]
    load: ""
    limit: 200
  # See customersAll for why these are declared. `load: ""` means the many2one fields come back
  # as bare ids, so `stage_id` and `partner_id` compare against NUMBERS here, not stage names —
  # which is exactly what the typed `{value}` slot makes expressible.
  pushdown:
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"] }
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: email_from, op: EQUALS, argPath: "domain.-", clause: ["email_from", "=", "{value}"] }
    - { property: email_from, op: CONTAINS, argPath: "domain.-", clause: ["email_from", "ilike", "{value}"] }
    - { property: partner_id, op: EQUALS, argPath: "domain.-", clause: ["partner_id", "=", "{value}"] }
    - { property: partner_id, op: IN, argPath: "domain.-", clause: ["partner_id", "in", "{values}"] }
    - { property: stage_id, op: EQUALS, argPath: "domain.-", clause: ["stage_id", "=", "{value}"] }
    - { property: stage_id, op: IN, argPath: "domain.-", clause: ["stage_id", "in", "{values}"] }
    - { property: probability, op: GREATER_THAN, argPath: "domain.-", clause: ["probability", ">", "{value}"] }
    - { property: probability, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["probability", ">=", "{value}"] }
    - { property: probability, op: LESS_THAN, argPath: "domain.-", clause: ["probability", "<", "{value}"] }
    - { property: probability, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["probability", "<=", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN, argPath: "domain.-", clause: ["expected_revenue", ">", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", ">=", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN, argPath: "domain.-", clause: ["expected_revenue", "<", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", "<=", "{value}"] }
    # Odoo compares datetimes against 'YYYY-MM-DD[ HH:MM:SS]' strings, so these stay strings.
    - { property: create_date, op: GREATER_THAN, argPath: "domain.-", clause: ["create_date", ">", "{value}"] }
    - { property: create_date, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["create_date", ">=", "{value}"] }
    - { property: create_date, op: LESS_THAN, argPath: "domain.-", clause: ["create_date", "<", "{value}"] }
    - { property: create_date, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["create_date", "<=", "{value}"] }
  # Odoo pages by absolute OFFSET, not page number: `limit` is the page size and `offset`
  # skips records already read. Without this the door made one call and returned `limit`
  # rows — indistinguishable from a book that small, which is how 500 of 1,344 customers
  # was reported as an exact figure. maxPages bounds the walk; hitting it warns.
  paging: { style: offset, param: offset, sizeParam: limit, size: 200, maxPages: 10 }
  cache: { kind: ttl, seconds: 300 }

# A lead's chatter — the emails and comments on the opportunity, which is where the actual
# state of a deal lives (the stage field says Proposition; the thread says the customer has
# gone quiet). Comments and emails only: tracking notes ("Stage changed") are noise to a
# reader and poison to a sentiment judge.
# EVERY opportunity on the book — open, won and lost. The sibling `leadsOpenAll` is the
# PIPELINE door and filters to what is still in play; at 2,000 deals it sees 1,200, so a
# per-account question that wants won/lost counts cannot be answered through it. Verified
# against the live book: 2,000 all / 1,200 open, with won_status in pending|won|lost.
#
# Odoo hides archived records by default and marks a LOST deal by archiving it, so the
# `active` OR is what makes closed deals visible at all. Prefix notation: `|` applies to
# the two terms that follow it; the rest of the list is ANDed, which is also why an
# appended pushdown clause lands correctly.
- name: leadsAll
  kind: api
  operation: leadsSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      - "|"
      - ["active", "=", true]
      - ["active", "=", false]
      # Partnerless leads excluded for the same falsy-key reason as leadsByStage.
      - ["partner_id", "!=", false]
    fields: [name, partner_id, expected_revenue, probability, email_from, stage_id, create_date, date_closed, won_status, date_deadline, user_id, active]
    load: ""
    limit: 1000
  # 1,000 a page: the book's 2,000 leads are three round trips, not eleven. It does NOT make the
  # sweep faster — measured 2026-09-23 it is ~10 s either way, because Odoo's search_read cost is
  # per record (the fields list, partner_id resolution), not per call. Fewer calls is all it buys.
  paging: { style: offset, param: offset, sizeParam: limit, size: 1000, maxPages: 5 }
  # See customersAll for why these are declared: the source filters, and an absorbed
  # predicate is what lets a count be pushed instead of the records walked.
  pushdown:
    - { property: won_status, op: EQUALS, argPath: "domain.-", clause: ["won_status", "=", "{value}"] }
    - { property: won_status, op: IN, argPath: "domain.-", clause: ["won_status", "in", "{values}"] }
    - { property: partner_id, op: EQUALS, argPath: "domain.-", clause: ["partner_id", "=", "{value}"] }
    - { property: partner_id, op: IN, argPath: "domain.-", clause: ["partner_id", "in", "{values}"] }
    - { property: stage_id, op: EQUALS, argPath: "domain.-", clause: ["stage_id", "=", "{value}"] }
    - { property: stage_id, op: IN, argPath: "domain.-", clause: ["stage_id", "in", "{values}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN, argPath: "domain.-", clause: ["expected_revenue", ">", "{value}"] }
    - { property: expected_revenue, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["expected_revenue", ">=", "{value}"] }
    - { property: expected_revenue, op: LESS_THAN, argPath: "domain.-", clause: ["expected_revenue", "<", "{value}"] }
    - { property: date_closed, op: GREATER_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", ">=", "{value}"] }
    - { property: date_closed, op: LESS_THAN_OR_EQUAL, argPath: "domain.-", clause: ["date_closed", "<=", "{value}"] }
  cache: { kind: ttl, seconds: 300 }


- name: messagesByLead
  kind: api
  keyType: int
  operation: messagesSearchRead
  records: "$[*]"
  keyArg: "domain.1.2"
  echoKeyAs: leadKey
  args:
    domain:
      - ["model", "=", "crm.lead"]
      - ["res_id", "in", []]
      - ["message_type", "in", ["comment", "email"]]
    fields: [res_id, body, date, author_id, subject, message_type]
    load: ""
    limit: 200

# ── The preparation surface: meetings and scheduled next-actions, behind the book door
# like every other set. This is data Odoo shows one record at a time; the point of having
# it here is composing it with everything else in one breath.

- name: meetingsAll
  kind: api
  operation: calendarSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain: []
    # partner_ids is the attendee list — a many2many, so it arrives as an id LIST even
    # under load:"" — which is exactly what the per-element MEETING_WITH join wants.
    fields: [name, start, stop, location, description, partner_ids]
    load: ""
    limit: 200
  cache: { kind: ttl, seconds: 300 }

- name: activitiesAll
  kind: api
  operation: activitySearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain: []
    fields: [res_model, res_id, res_name, summary, date_deadline, user_id]
    load: ""
    limit: 500
  cache: { kind: ttl, seconds: 300 }

# Every company in the CRM, bought or not. The same record shape as customersAll.
- name: companiesAll
  kind: api
  operation: partnersSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      - ["is_company", "=", true]
    fields: [name, email, phone, city, is_company, website]
    load: ""
    limit: 500
  # Same door, same fields as customersAll — so the same rules, for the same reasons.
  pushdown:
    - { property: name, op: EQUALS, argPath: "domain.-", clause: ["name", "=", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"] }
    - { property: name, op: IN, argPath: "domain.-", clause: ["name", "in", "{values}"] }
    - { property: email, op: EQUALS, argPath: "domain.-", clause: ["email", "=", "{value}"] }
    - { property: email, op: CONTAINS, argPath: "domain.-", clause: ["email", "ilike", "{value}"] }
    - { property: email, op: IN, argPath: "domain.-", clause: ["email", "in", "{values}"] }
    - { property: city, op: EQUALS, argPath: "domain.-", clause: ["city", "=", "{value}"] }
    - { property: city, op: CONTAINS, argPath: "domain.-", clause: ["city", "ilike", "{value}"] }
    - { property: website, op: CONTAINS, argPath: "domain.-", clause: ["website", "ilike", "{value}"] }
    - { property: website, op: EQUALS, argPath: "domain.-", clause: ["website", "=", "{value}"] }
    - { property: phone, op: EQUALS, argPath: "domain.-", clause: ["phone", "=", "{value}"] }
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
  # Odoo pages by absolute OFFSET, not page number: `limit` is the page size and `offset`
  # skips records already read. Without this the door made one call and returned `limit`
  # rows — indistinguishable from a book that small, which is how 500 of 1,344 customers
  # was reported as an exact figure. maxPages bounds the walk; hitting it warns.
  paging: { style: offset, param: offset, sizeParam: limit, size: 500, maxPages: 20 }
  cache: { kind: ttl, seconds: 300 }

# ── Back from the ACCOUNT. The business vocabulary's CustomerAccount is a spine several systems
# key; these lead from it to what Odoo holds, so a question that starts at an account — asked
# by a realm that has never heard of Odoo — reaches the deals, the people and the notes.

# Odoo's record of an account, by the company's domain. `ilike` is a SUBSTRING match, so this
# does not echo the asked key: the join matches each record's own `website` through the spine.
# One call per account — `ilike` takes no list.
- name: customersByWebsite
  kind: api
  operation: partnersSearchRead
  records: "$[*]"
  # String mode: `ilike` wants a string, and list mode would hand it ["stark.com"].
  keyTemplate: "{key}"
  batchSafe: false
  args:
    domain:
      - ["website", "ilike", "{keys}"]
      # Companies only: a contact inherits nothing here, but one may carry the same website.
      - ["is_company", "=", true]
    fields: [name, email, phone, city, country_id, is_company, website]
    load: ""
    limit: 20
  # An account billing knows and the CRM does not is asked about on every query otherwise.
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

# Every opportunity with a customer. The leading clause is the key; the OR after it asks for
# archived leads too, because archived is how Odoo marks a LOST deal and search_read hides
# them by default. Batch IN: one call for a whole traversal.
- name: leadsByPartner
  kind: api
  keyType: int
  operation: leadsSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  args:
    domain:
      - ["partner_id", "in", []]
      - "|"
      - ["active", "=", true]
      - ["active", "=", false]
    fields: [name, partner_id, expected_revenue, probability, email_from, stage_id, create_date, date_closed, won_status, date_deadline, user_id, active]
    load: ""
    limit: 200
  # BATCHED AND TO-MANY: one call carries up to `maxKeysPerCall` partners, and `limit` bounds
  # the WHOLE response, not each key. Without paging a prolific partner fills the batch and
  # the partners after it come back with nothing — the starvation `batchSafe: false` exists
  # for, arriving through `limit` instead. Paging reads the chunk out in full, so every key
  # in it is complete; Odoo pages by absolute offset.
  paging: { style: offset, param: offset, sizeParam: limit, size: 200, maxPages: 25 }
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

- name: contactsByCompany
  kind: api
  keyType: int
  operation: partnersSearchRead
  records: "$[*]"
  keyArg: "domain.0.2"
  args:
    domain:
      - ["parent_id", "in", []]
    fields: [name, email, function, phone, parent_id]
    load: ""
    limit: 200
  # BATCHED AND TO-MANY: one call carries up to `maxKeysPerCall` partners, and `limit` bounds
  # the WHOLE response, not each key. Without paging a prolific partner fills the batch and
  # the partners after it come back with nothing — the starvation `batchSafe: false` exists
  # for, arriving through `limit` instead. Paging reads the chunk out in full, so every key
  # in it is complete; Odoo pages by absolute offset.
  paging: { style: offset, param: offset, sizeParam: limit, size: 200, maxPages: 25 }
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

# What was written on a partner's own record — a company or a person. The record carries
# `res_id`, the partner it was written on, so no echo is needed and the batch is safe.
- name: messagesByPartner
  kind: api
  keyType: int
  operation: messagesSearchRead
  records: "$[*]"
  keyArg: "domain.1.2"
  args:
    domain:
      - ["model", "=", "res.partner"]
      - ["res_id", "in", []]
      - ["message_type", "in", ["comment", "email"]]
    fields: [res_id, body, date, author_id, subject, message_type]
    load: ""
    limit: 200
  # BATCHED AND TO-MANY: one call carries up to `maxKeysPerCall` partners, and `limit` bounds
  # the WHOLE response, not each key. Without paging a prolific partner fills the batch and
  # the partners after it come back with nothing — the starvation `batchSafe: false` exists
  # for, arriving through `limit` instead. Paging reads the chunk out in full, so every key
  # in it is complete; Odoo pages by absolute offset.
  paging: { style: offset, param: offset, sizeParam: limit, size: 200, maxPages: 50 }
  cache: { kind: ttl, seconds: 300, negativeTtlSeconds: 300 }

# THE WHOLE CHATTER BOOK, swept once. The per-anchor doors above (`messagesByPartner`,
# `messagesByLead`) are right for a question about ONE account and wrong for a question about
# the book: asking them across every account binds one anchor per account and the engine
# refuses above `maxAnchors` (200). Measured 2026-09-21: 1,516 accounts had an open support
# case, so every notes-across-the-book view died in the planner — `HealthCompanyNotesForOpenCases`
# and its two siblings returned an ERROR, the Account Signals app withheld the CRM signals
# entirely, and the page said so rather than calling a troubled account good news.
#
# One sweep instead. `model` rides on every record, so ONE door serves all three questions —
# notes on the company, on a person there, and on a deal — and the consumer picks the side it
# wants with `WHERE n.model = …` rather than three producers fetching the same table.
#
# The same shape as `companiesAll` / `leadsAll`: pinned by the literal book scope, echoed back
# as `scopeKey`, paged by absolute offset. maxPages is high because chatter is the most
# numerous thing in an Odoo instance by a wide margin — hitting it warns rather than silently
# truncating.
# EVERY partner, company and person alike. `customersAll` filters `customer_rank > 0` and
# `companiesAll` filters `is_company = true`, so between them they see only COMPANIES — measured
# 2026-09-21, 1,333 of them. Chatter does not respect that boundary: of 4,000 notes written on
# `res.partner`, only 1,333 were on a partner either door could reach; the other 2,667 were
# written on CONTACTS, the people at those companies, and were unreachable except one company
# at a time through `contactsByCompany`. A notes-across-the-book question needs both sides in
# one sweep, and `is_company` is what separates them afterwards.
- name: partnersAll
  kind: api
  operation: partnersSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    # No domain at all: the whole partner table, companies and people together.
    domain: []
    fields: [name, email, phone, city, is_company, website, parent_id]
    load: ""
    limit: 500
  pushdown:
    - { property: is_company, op: EQUALS, argPath: "domain.-", clause: ["is_company", "=", "{value}"] }
    - { property: id, op: EQUALS, argPath: "domain.-", clause: ["id", "=", "{value}"] }
    - { property: id, op: IN, argPath: "domain.-", clause: ["id", "in", "{values}"] }
    - { property: email, op: EQUALS, argPath: "domain.-", clause: ["email", "=", "{value}"] }
    - { property: email, op: CONTAINS, argPath: "domain.-", clause: ["email", "ilike", "{value}"] }
    - { property: name, op: CONTAINS, argPath: "domain.-", clause: ["name", "ilike", "{value}"] }
  paging: { style: offset, param: offset, sizeParam: limit, size: 500, maxPages: 40 }
  cache: { kind: ttl, seconds: 300 }

- name: messagesAll
  kind: api
  operation: messagesSearchRead
  records: "$[*]"
  keyArg: "context.scope"
  echoKeyAs: scopeKey
  args:
    domain:
      # Both sides of the vocabulary's AccountNote: what was written on a partner (the company
      # or a contact there) and what was written on an opportunity.
      - ["model", "in", ["res.partner", "crm.lead"]]
      - ["message_type", "in", ["comment", "email"]]
    fields: [model, res_id, body, date, author_id, subject, message_type]
    load: ""
    limit: 500
  pushdown:
    - { property: model, op: EQUALS, argPath: "domain.-", clause: ["model", "=", "{value}"] }
    - { property: model, op: IN, argPath: "domain.-", clause: ["model", "in", "{values}"] }
    - { property: res_id, op: EQUALS, argPath: "domain.-", clause: ["res_id", "=", "{value}"] }
    - { property: res_id, op: IN, argPath: "domain.-", clause: ["res_id", "in", "{values}"] }
    - { property: message_type, op: EQUALS, argPath: "domain.-", clause: ["message_type", "=", "{value}"] }
  paging: { style: offset, param: offset, sizeParam: limit, size: 500, maxPages: 40 }
  cache: { kind: ttl, seconds: 300 }
