# The core CRM/sales/invoicing surface, typed from what the ORM ITSELF declares (fields_get):
# every relation below is a declared many2one, not a guessed join. Field descriptions borrow
# Odoo's own labels and help text. EVERY type is virtual — nothing is mirrored; a traversal
# fetches through the middle tier at query time.
#
#   MATCH (q:OdooStagePipeline {stage:'Proposition'})-[:HAS_LEAD]->(l:OdooLead)
#   OPTIONAL MATCH (l)-[:LEAD_OF]->(c:OdooCustomer)-[:HAS_UNPAID_INVOICE]->(i:OdooInvoice)
#   RETURN c.name, l.name, l.expected_revenue, i.name, i.amount_residual

- name: OdooStagePipeline
  visibility: internal
  description: >-
    The open pipeline at one CRM stage, pinned by the stage's NAME exactly as Odoo shows it
    ('New', 'Qualified', 'Proposition', 'Won'). Pin it with a literal and traverse HAS_LEAD;
    it is not stored and does not need to exist.
  properties:
    stage: { metadata: { identity: "true" } }

- name: OdooLead
  visibility: internal
  # A child of the business vocabulary's Opportunity (realm-business-vocabulary, which must
  # be installed first): the node carries :Opportunity as well as :OdooLead, so a question
  # asked about opportunities is answered here without naming Odoo.
  parents: [Opportunity]
  description: >-
    A CRM lead/opportunity. expected_revenue and probability are Odoo's own pipeline figures;
    partner_id is the linked customer (bare id) when the lead has been connected to one.
  properties:
    id: { metadata: { identity: "true" } }
    name: "The opportunity's title."
    partner_id: "Linked partner id (Odoo: 'Contact' — usually set when converting the lead)."
    expected_revenue: "Expected Revenue, in company currency."
    probability: "Probability percent; 100 on won, 0 on lost."
    email_from: "Email of the contact the lead came from."
    stage_id: "Stage id."
    create_date: "When the lead was created."
    date_closed: "When the opportunity was won or lost (set on close)."
    won_status: "won, lost or pending — Odoo's own words; pending means still open."
    date_deadline: "Expected closing date."
    user_id: "The salesperson's user id."
    active: "False once the opportunity is archived, which is how Odoo marks a LOST deal."
    stageKey: "Echo of the stage name this lead was fetched under."
    scopeKey: "Echo of the book scope this lead was fetched under."
  virtualJoins:
    - { anchorLabel: OdooBook, relationship: HAS_OPEN_LEAD, keyField: scope,
        recordKeyField: scopeKey, producer: leadsOpenAll,
        description: "Every open opportunity on the book, any stage." }
    # The same door WIDENED to closed deals. HAS_OPEN_LEAD is the pipeline and stops at
    # what is still in play — 1,200 of 2,000 on this book — so a per-account question that
    # counts what was WON or LOST cannot be answered through it, and had to fan out one
    # call per account instead. Named apart from HAS_OPEN_LEAD rather than replacing it:
    # "the pipeline" and "every deal ever" are different questions and both get asked.
    - { anchorLabel: OdooBook, relationship: HAS_ANY_LEAD, keyField: scope,
        recordKeyField: scopeKey, producer: leadsAll,
        description: "Every opportunity on the book — open, won and lost. Read won_status to tell them apart." }
    - { anchorLabel: OdooStagePipeline, relationship: HAS_LEAD, keyField: stage,
        recordKeyField: stageKey, producer: leadsByStage,
        description: "Every active lead sitting at this pipeline stage." }
    # EVERY deal with the customer: open, won and lost. The two doors above are the pipeline;
    # this is the history, and a question about an account needs the history.
    - { anchorLabel: OdooCustomer, relationship: HAS_OPPORTUNITY, keyField: id,
        recordKeyField: partner_id, producer: leadsByPartner,
        description: "Every opportunity with this customer — open, won or lost." }

- name: OdooCustomer
  visibility: internal
  # The CRM's RECORD of an account, not the account: `parents: [CrmAccount]` says what kind of
  # record it is, and `hub: CustomerAccount` on `website` (below) says whose. From the account,
  # TRACKED_AS leads back here, and from here to Odoo's opportunities, contacts and notes.
  parents: [CrmAccount]
  description: >-
    A partner (res.partner) — a customer, contact or company. email is the bridge field: on a
    Me appliance this is where a Person-spine join would anchor.
  properties:
    id: { metadata: { identity: "true" } }
    name: { description: "Display name.", metadata: { canonical: name } }
    email: "Email address."
    phone: "Phone."
    city: "City."
    country_id: "Country id."
    is_company: "True for companies, false for individuals."
    # What identifies the COMPANY, as opposed to `id`, which identifies Odoo's record of it and
    # is what every join in this realm keys on. The spine normalizes; this realm sends the URL
    # exactly as Odoo holds it.
    website:
      hub: CustomerAccount
      description: "Company website URL, as Odoo holds it. A domain identifies a company; a name does not. Odoo spells 'unset' as FALSE, which keys nothing."
    scopeKey: "Echo of the book scope this customer was fetched under."
  virtualJoins:
    - { anchorLabel: OdooBook, relationship: HAS_CUSTOMER, keyField: scope,
        recordKeyField: scopeKey, producer: customersAll,
        description: "Every customer on the book (customer_rank > 0)." }
    # Prospects too. HAS_CUSTOMER is who has BOUGHT; an account-level question is as often about
    # a company sales is still courting, and it has to be an account before anything can be
    # said about it.
    - { anchorLabel: OdooBook, relationship: HAS_COMPANY, keyField: scope,
        recordKeyField: scopeKey, producer: companiesAll,
        description: "Every company the CRM knows — customers and prospects alike." }
    # Per-element join over the meeting's attendee LIST — one meeting fans out to each
    # attendee partner, so "who am I meeting and what do they owe us" is one traversal.
    - { anchorLabel: OdooMeeting, relationship: MEETING_WITH, keyField: partner_ids,
        recordKeyField: id, producer: customersById,
        description: "The partners attending this meeting." }
    - { anchorLabel: OdooLead, relationship: LEAD_OF, keyField: partner_id, recordKeyField: id,
        producer: customersById, description: "The customer an opportunity belongs to." }
    # The vocabulary's own edge, from the vocabulary's own anchor. Odoo is asked for the
    # account's domain with `website ilike`, a SUBSTRING match, and recordKeyField is `website`
    # and NOT an echo of the asked key: read through the spine, `https://www.stark.com` is
    # stark.com and `https://notstark.com` is not, so a stray is left unlinked.
    - { anchorLabel: CustomerAccount, relationship: TRACKED_AS, keyField: accountKey,
        recordKeyField: website, producer: customersByWebsite,
        description: "Odoo's record of a customer account, matched on the company's website." }

- name: OdooInvoice
  visibility: internal
  description: "A posted, not-fully-paid customer invoice. amount_residual is what is still owed; invoice_date_due is when it was due."
  properties:
    id: { metadata: { identity: "true" } }
    name: "Invoice number."
    partner_id: "Customer id."
    amount_total: "Invoice total."
    amount_residual: "Amount still owed."
    invoice_date_due: "Due date."
    payment_state: "not_paid or partial."
    partnerKey: "Echo of the partner id this invoice was fetched under."
    scopeKey: "Echo of the book scope this invoice was fetched under."
  virtualJoins:
    - { anchorLabel: OdooBook, relationship: HAS_UNPAID_INVOICE, keyField: scope,
        recordKeyField: scopeKey, producer: invoicesUnpaidAll,
        description: "Every posted, unpaid customer invoice on the book." }
    - { anchorLabel: OdooCustomer, relationship: HAS_UNPAID_INVOICE, keyField: id,
        recordKeyField: partnerKey, producer: unpaidInvoicesByPartner,
        description: "Posted customer invoices not fully paid." }
    # Same records, anchored one hop EARLIER: lead and invoice both carry partner_id, so the
    # pipeline question reaches invoices at depth 2 (a branch off the lead) instead of a
    # depth-3 chain — which the engine currently loses silently (platform issue; see realm
    # notes). Same producer, same filter, stated twice on purpose.
    - { anchorLabel: OdooLead, relationship: CUSTOMER_OWES, keyField: partner_id,
        recordKeyField: partnerKey, producer: unpaidInvoicesByPartner,
        description: "Unpaid invoices of the customer this lead belongs to." }

- name: OdooOrder
  visibility: internal
  description: "A sales order or quotation. state is draft/sent (quotation), sale (confirmed), done, or cancel."
  properties:
    id: { metadata: { identity: "true" } }
    name: "Order reference."
    partner_id: "Customer id."
    amount_total: "Order total."
    state: "draft, sent, sale, done, or cancel."
    date_order: "Order date."
    partnerKey: "Echo of the partner id this order was fetched under."
  virtualJoins:
    - { anchorLabel: OdooCustomer, relationship: HAS_ORDER, keyField: id,
        recordKeyField: partnerKey, producer: ordersByPartner,
        description: "Sales orders and quotations, any state." }

- name: OdooBook
  visibility: internal
  description: >-
    The whole Odoo book, pinned by the LITERAL scope 'all' — always write
    MATCH (b:OdooBook {scope:'all'}) and traverse. HAS_CUSTOMER reaches every customer,
    HAS_UNPAID_INVOICE every posted unpaid customer invoice, HAS_OPEN_LEAD every open
    opportunity. This is the door for questions about the sets: how many customers, who
    owes most, total pipeline. It is not stored and does not need to exist.
  properties:
    scope: { metadata: { identity: "true", default: "all" } }

# A chatter message on an opportunity. Body arrives as HTML, as Odoo stores it — a consumer
# doing judgment (sentiment, classification) should strip tags first, not ask the model to.
- name: OdooContact
  visibility: internal
  userAnchor: false
  parents: [AccountContact]
  description: >-
    A person at a customer company (a res.partner whose parent is the company), and an
    AccountContact of the business vocabulary.
  properties:
    id: { identity: true, description: "Odoo partner id." }
    name: "Full name."
    email: "Email address."
    function: "Job title."
    phone: "Phone."
    parent_id: "The company's partner id."
  virtualJoins:
    - { anchorLabel: OdooCustomer, relationship: HAS_ACCOUNT_CONTACT, keyField: id,
        recordKeyField: parent_id, producer: contactsByCompany,
        description: "The people Odoo knows at this company." }

- name: OdooMessage
  userAnchor: false
  # An AccountNote of the business vocabulary: what our own people wrote down, wherever in
  # Odoo they wrote it — on the company, on a person there, or on a deal. What the CRM
  # BELIEVES lives in these, which is why "is this problem mentioned anywhere?" reads them.
  parents: [AccountNote]
  description: |
    An email or comment from an opportunity's chatter thread, newest state of the deal in
    the participants' own words. Tracking entries are excluded at the producer.
  properties:
    id:
      identity: true
      description: "Odoo mail.message id."
    body: "Message body, as HTML."
    date: "When it was sent (UTC)."
    subject: "Subject, when the message was an email."
    message_type: "comment (internal note / log) or email."
    res_id: "The id of the record it was written on."
    author_id: "The author's partner id."
    leadKey: "Echo of the lead this message was fetched under."
  virtualJoins:
    - { anchorLabel: OdooLead, relationship: HAS_MESSAGE, keyField: id, recordKeyField: leadKey,
        producer: messagesByLead,
        description: "The opportunity's chatter thread — recent interactions on the deal." }
    - { anchorLabel: OdooLead, relationship: HAS_NOTE, keyField: id, recordKeyField: leadKey,
        producer: messagesByLead,
        description: "What was written on the deal (the same thread, by the vocabulary's name)." }
    - { anchorLabel: OdooCustomer, relationship: HAS_NOTE, keyField: id, recordKeyField: res_id,
        producer: messagesByPartner,
        description: "What was written on the company's own record." }
    - { anchorLabel: OdooContact, relationship: HAS_NOTE, keyField: id, recordKeyField: res_id,
        producer: messagesByPartner,
        description: "What was written on a contact's record." }

# A calendar meeting. The preparation anchor: walk MEETING_WITH to the attendee partners and
# from them to everything else the book knows — debt, deals, chatter, firmographics, news.
- name: OdooMeeting
  userAnchor: false
  description: |
    A meeting from the Odoo calendar, with its attendee partner ids. Times are UTC as Odoo
    stores them.
  properties:
    id:
      identity: true
      description: "Odoo calendar.event id."
    name: "Meeting subject."
    start: "Start (UTC)."
    stop: "End (UTC)."
    location: "Location, when set."
    description: "Agenda / notes, when set."
    partner_ids: { cardinality: LIST, description: "Attendee partner ids — the key MEETING_WITH fans out over." }
  virtualJoins:
    - { anchorLabel: OdooBook, relationship: HAS_MEETING, keyField: scope,
        recordKeyField: scopeKey, producer: meetingsAll,
        description: "Every calendar meeting in the book." }

# A scheduled next action (mail.activity): the to-do Odoo attaches to a record. res_model +
# res_id say what it hangs on; deadlines make "what needs doing" a date filter, not a guess.
- name: OdooActivity
  userAnchor: false
  description: |
    A scheduled activity — call, to-do, email — with its deadline and the record it belongs
    to (res_model/res_id, e.g. a crm.lead id).
  properties:
    id:
      identity: true
      description: "Odoo mail.activity id."
    summary: "What the activity is, when the author wrote one."
    res_model: "Model of the record it hangs on (crm.lead, res.partner, ...)."
    res_id: "Id of that record."
    res_name: "Display name of that record."
    date_deadline: "Due date."
  virtualJoins:
    - { anchorLabel: OdooBook, relationship: HAS_ACTIVITY, keyField: scope,
        recordKeyField: scopeKey, producer: activitiesAll,
        description: "Every scheduled activity in the book." }
