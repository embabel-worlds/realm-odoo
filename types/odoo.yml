# The core CRM/sales/invoicing surface, typed from what the ORM ITSELF declares (fields_get):
# every relation below is a declared many2one, not a guessed join. Field descriptions borrow
# Odoo's own labels and help text. EVERY type is virtual — nothing is mirrored; a traversal
# fetches through the middle tier at query time.
#
#   MATCH (q:OdooStagePipeline {stage:'Proposition'})-[:HAS_LEAD]->(l:OdooLead)
#   OPTIONAL MATCH (l)-[:LEAD_OF]->(c:OdooCustomer)-[:HAS_UNPAID_INVOICE]->(i:OdooInvoice)
#   RETURN c.name, l.name, l.expected_revenue, i.name, i.amount_residual
#
# TWO CLOCKS. Odoo keeps two kinds of date, and a question has to say which it means:
#   - the SYSTEM clock — create_date, date_closed, date_last_stage_update, a message's date:
#     when Odoo was told, stamped by the server, in UTC, as 'YYYY-MM-DD HH:MM:SS'. On a book that
#     was imported or seeded these are the load time, not when the deal really began;
#   - BUSINESS dates — date_deadline, invoice_date, invoice_date_due: what a person agreed or
#     typed, as 'YYYY-MM-DD' with no time and no zone.
# Compare either against 'YYYY-MM-DD' or 'YYYY-MM-DD HH:MM:SS' literals: those reach Odoo as
# filters, and they sort against the stored strings exactly. An ISO 'T' does not
# ('2026-10-22T09:00' sorts after every '2026-10-22 …'). `date()` in a query is the APPLIANCE's
# day, which is not necessarily the business's.
#
# Every date property declares its shape as `format:`, and every money property its currency as
# `currency: currency` (the row's ISO code is in `currency`); a model writing a query sees both
# under the type, so the descriptions say only what those fields cannot — which clock, and why.

- name: OdooStagePipeline
  visibility: internal
  description: >-
    The open pipeline at one CRM stage, pinned by the stage's NAME exactly as Odoo shows it.
    Stages are each business's own; Odoo's defaults are 'New', 'Qualified', 'Proposition' and
    'Won'. Pin it with a literal and traverse HAS_LEAD: MATCH (q:OdooStagePipeline
    {stage:'Proposition'})-[:HAS_LEAD]->(l). It is not stored and does not need to exist. The
    stages in use are the distinct `stage` values of the leads.
  properties:
    stage: { description: "The stage name, exactly as Odoo shows it (case and spelling matter). Odoo's defaults are 'New', 'Qualified', 'Proposition' and 'Won'; each business has its own.", metadata: { identity: "true" } }

- name: OdooLead
  visibility: internal
  # A child of the business vocabulary's Opportunity (realm-business-vocabulary, which must
  # be installed first): the node carries :Opportunity as well as :OdooLead, so a question
  # asked about opportunities is answered here without naming Odoo.
  parents: [Opportunity]
  description: >-
    One Odoo CRM deal (crm.lead), identified by `id`, open or decided: status is open (Odoo's
    won_status 'pending'), won, or lost — a lost deal is ARCHIVED (active=false).
    expected_revenue/amount are in `currency`, major units. probability is a 0–1 fraction;
    probabilityPercent is Odoo's 0–100.
    Doors from OdooBook: HAS_OPEN_LEAD (the pipeline: active, under 100%), HAS_ANY_LEAD (every
    deal; what a bare MATCH (o:Opportunity) takes), HAS_DECIDED_LEAD (won and lost only, cached
    an hour). From a customer: HAS_OPPORTUNITY (all of its deals). One deal by id is one call:
    MATCH (b:OdooBook)-[:HAS_ANY_LEAD]->(l:OdooLead) WHERE l.id = $id. Filters on status, stage,
    ownerName, partner_id, type, the amounts, probabilityPercent and the dates are applied by
    Odoo, not after the fetch. Leads with no customer are not reachable here.
    Example — this quarter's wins by salesperson: MATCH (b:OdooBook)-[:HAS_DECIDED_LEAD]->(l)
    WHERE l.status = 'won' AND l.closeOn >= '2026-10-01' RETURN l.ownerName, count(l),
    sum(l.amount).
  properties:
    id: { description: "Odoo crm.lead id. Write it quoted ('123'); Odoo is asked for the number.", metadata: { identity: "true" } }
    name: "The deal's title, as Odoo shows it. Same as `title`."
    title: "The deal's title (the vocabulary's name for `name`)."
    partner_id: "The customer's partner id (bare). LEAD_OF reaches the customer itself."
    type: "Odoo's own split: 'opportunity' (in the pipeline) or 'lead' (not yet qualified). Every door carries both; filter on it to mean one."
    expected_revenue: { type: float, currency: currency, description: "Expected revenue, major units: 12500.0 is 12,500.00, in the company currency. Odoo's own figure, never recomputed." }
    amount: { type: float, currency: currency, description: "The deal value (the vocabulary's name for expected_revenue), in major units." }
    currency: "ISO 4217 code of the company currency every amount here is in, e.g. 'USD'."
    probability: { type: float, unit: fraction, description: "Win probability as a FRACTION 0–1 (the vocabulary's meaning): 0.65 is 65%. 1.0 on won, 0 on lost. Not filtered by Odoo — filter on probabilityPercent." }
    probabilityPercent: { type: float, unit: percent, description: "Win probability as Odoo states it, 0–100: 65 is 65%. 100 on won, 0 on lost. `l.probabilityPercent >= 60` is applied by Odoo." }
    priority: "Odoo's priority code as stored: '0' low, '1' medium, '2' high, '3' very high (the stars on a card). Read priorityLabel."
    priorityLabel: "Priority in words: low, medium, high or very_high. Filtered in the graph; Odoo is asked for nothing on it."
    email_from: "Email of the contact the lead came from, as typed."
    stage_id: "Stage id (bare). The stage's NAME is `stage`."
    stage: "Pipeline stage by name, as Odoo shows it: each business has its own; Odoo's defaults are 'New', 'Qualified', 'Proposition', 'Won'. Filtered by Odoo."
    won_status: "Odoo's verdict: 'pending' (still open), 'won', or 'lost'. A deal archived without being lost stays 'pending' but is not in the pipeline (active=false)."
    status: "'open', 'won' or 'lost' (won_status, 'pending' read as 'open'). Odoo applies 'won'/'lost'; for open deals use HAS_OPEN_LEAD or won_status = 'pending'."
    active: "False once the deal is archived — which is how Odoo marks a LOST deal, and which hides it from Odoo's own lists. The pipeline doors read active deals only."
    create_date: { format: "yyyy-MM-dd HH:mm:ss, UTC", description: "SYSTEM clock: when the record was created in Odoo. On an imported or seeded book this is the load time, not when the deal began." }
    date_closed: { format: "yyyy-MM-dd HH:mm:ss, UTC", description: "SYSTEM clock: when the deal was marked won or lost. Null while open. The close date for 'won last quarter'." }
    date_deadline: { format: yyyy-MM-dd, description: "BUSINESS date: the expected closing date the salesperson set, no zone. Null when nobody set one." }
    date_last_stage_update: { format: "yyyy-MM-dd HH:mm:ss, UTC", description: "SYSTEM clock: when the deal last moved stage. How long a deal has sat still." }
    closeOn: { format: yyyy-MM-dd, description: "date_deadline while open; the UTC day of date_closed once decided. Odoo applies a window on it through HAS_DECIDED_LEAD." }
    lostReason: "Why a lost deal was lost, as Odoo names the reason ('Too expensive'). Only through HAS_DECIDED_LEAD; null when none was given."
    user_id: "The salesperson's Odoo user id (bare). Their NAME is `ownerName`."
    ownerName: "The salesperson who owns the deal, by name. `l.ownerName = $name` is applied by Odoo."
    sourceUrl: "Opens this deal in Odoo."
    stageKey: "Set only on a lead reached through OdooStagePipeline (the stage it was fetched under); null otherwise. For a lead's stage read `stage`."
    scopeKey: "Echo of the book scope this lead was fetched under."
  virtualJoins:
    - { anchorLabel: OdooBook, relationship: HAS_OPEN_LEAD, keyField: scope,
        recordKeyField: scopeKey, producer: leadsOpenAll, maxFanoutTotal: 50000,
        description: "The open pipeline: every active deal under 100% probability, any stage, biggest expected revenue first. Odoo applies the deal filters, so `WHERE l.stage = 'Proposition'` or `l.ownerName = '…'` reads only those." }
    # The same door WIDENED to closed deals. HAS_OPEN_LEAD is the pipeline and stops at
    # what is still in play — 1,200 of 2,000 on this book — so a per-account question that
    # counts what was WON or LOST cannot be answered through it, and had to fan out one
    # call per account instead. Named apart from HAS_OPEN_LEAD rather than replacing it:
    # "the pipeline" and "every deal ever" are different questions and both get asked.
    # implicitDoor: a bare `MATCH (o:Opportunity)` takes THIS door — every deal, as the vocabulary
    # means it ("open or decided"); the pipeline is `WHERE o.status = 'open'`.
    - { anchorLabel: OdooBook, relationship: HAS_ANY_LEAD, keyField: scope,
        recordKeyField: scopeKey, producer: leadsAll, maxFanoutTotal: 50000, implicitDoor: true,
        description: "Every deal on the book — open, won AND lost. NOT the pipeline: a pipeline total (by stage, by owner, overall) is HAS_OPEN_LEAD, or the OdooPipelineByStage view. `WHERE l.status = 'won'` is applied by Odoo." }
    # Won and lost only, cached an hour: a decided deal almost never changes. The door for wins,
    # losses and win rates over a window, which no longer re-read the open pipeline to find them.
    - { anchorLabel: OdooBook, relationship: HAS_DECIDED_LEAD, keyField: scope,
        recordKeyField: scopeKey, producer: leadsDecidedAll, maxFanoutTotal: 50000,
        description: "Every DECIDED deal — won or lost — newest decision first. The door for 'biggest win this quarter', 'what did we lose and why' and win rates: `WHERE l.status = 'won' AND l.closeOn >= '2026-10-01'` is one filtered read." }
    - { anchorLabel: OdooStagePipeline, relationship: HAS_LEAD, keyField: stage,
        recordKeyField: stageKey, producer: leadsByStage,
        description: "Every active deal sitting at this pipeline stage, open or won." }
    # EVERY deal with the customer: open, won and lost. The two doors above are the pipeline;
    # this is the history, and a question about an account needs the history.
    # materializedKeyField: once the book's leads are swept, a customer's opportunities are the swept
    # leads whose partner_id is its id — no fetch per customer (embabel/me#1489).
    - { anchorLabel: OdooCustomer, relationship: HAS_OPPORTUNITY, keyField: id,
        recordKeyField: partner_id, producer: leadsByPartner, materializedKeyField: partner_id,
        description: "Every deal with this customer — open, won or lost. One call for any number of customers; a filter on status, stage or dates is applied by Odoo." }

- name: OdooCustomer
  visibility: internal
  # The CRM's RECORD of an account, not the account: `parents: [CrmAccount]` says what kind of
  # record it is, and `hub: CustomerAccount` on `website` (below) says whose. From the account,
  # TRACKED_AS leads back here, and from here to Odoo's opportunities, contacts and notes.
  parents: [CrmAccount]
  description: >-
    One Odoo partner (res.partner), identified by `id`: a COMPANY (is_company true) or a
    PERSON/address (false). parent_id means two things: on a company its parent company, on a
    person their employer. One company by name is one call: MATCH
    (b:OdooBook)-[:HAS_COMPANY]->(c) WHERE c.name = $name (exact, case and all).
    Which door: HAS_CUSTOMER — partners we have sold to or invoiced (customer_rank > 0), companies
    and people alike; HAS_COMPANY — every company, prospects included (what a bare MATCH
    (k:CrmAccount) takes); HAS_PARTNER — companies AND people. Archived partners are reached by
    none. Up the group: SUBSIDIARY_OF (one parent per hop, companies only); down: HAS_SUBSIDIARY.
    commercialPartnerId is the company a person trades under (a company's own id on a company).
    `website` keys the business vocabulary's CustomerAccount. Filters on name, email, website,
    city, country, industry, ownerName, relationship 'customer', is_company and parent_id are
    applied by Odoo; `toLower(c.name) CONTAINS $fragment` is too (case-blind).
  properties:
    id: { description: "Odoo partner id. Write it quoted ('42'); Odoo is asked for the number.", metadata: { identity: "true" } }
    name: { description: "Display name, exactly as Odoo holds it. `c.name = $name` is an exact, case-sensitive match.", metadata: { canonical: name } }
    email: { joinKey: "email", description: "Email address, as typed in Odoo. Compare without case (`toLower(c.email) = …`) to match another system's." }
    phone: "Phone number, as typed in Odoo (no normalised format)."
    city: "City of the partner's address, as typed in Odoo."
    country_id: "Country id (bare). The country's NAME is `country`."
    country: "The country, by name ('Australia')."
    is_company: { type: boolean, description: "True for a company, false for a person or an address. Write `c.is_company = true`; Odoo applies it, and counts it." }
    # What identifies the COMPANY, as opposed to `id`, which identifies Odoo's record of it and
    # is what every join in this realm keys on. The spine normalizes; this realm sends the URL
    # exactly as Odoo holds it.
    #
    # `canonical:` copies the value onto the account as well. Odoo is the CRM, and the
    # vocabulary says the account is what the CRM knows of it, so the account's own website,
    # industry, relationship, owner and link are filled from here — and only from here: an
    # account no CRM record keys keeps them empty rather than borrow billing's guess.
    website:
      hub: CustomerAccount
      description: "Company website URL as Odoo holds it; keys the vocabulary's CustomerAccount by its registrable domain. A domain identifies a company, a name does not."
      metadata: { canonical: website }
    industry_id: "Industry id (bare). Its NAME is `industry`."
    industry: { description: "Industry, as Odoo names it ('Manufacturing').", metadata: { canonical: industry } }
    user_id: "The salesperson's Odoo user id (bare). Their NAME is `ownerName`."
    ownerName: { description: "The salesperson who owns the account, by name.", metadata: { canonical: ownerName } }
    # Odoo's own measure: customer_rank counts the sales and invoices made out to the partner,
    # so above zero they have bought from us. A supplier we have never sold to is neither.
    relationship:
      description: "customer (sold to or invoiced: customer_rank > 0), prospect (not yet, not a supplier), or other (a supplier never sold to). Odoo applies 'customer'."
      metadata: { canonical: relationship }
    sourceUrl: { description: "Opens this partner in Odoo.", metadata: { canonical: sourceUrl } }
    parent_id: "Odoo's parent_id (bare id), which means two things: on a company its parent company, on a person the company they work at. Null when unset."
    parentCompanyId: "The parent company's partner id — parent_id, but only on a company record; null on a person and on a company with no parent. What SUBSIDIARY_OF follows."
    commercialPartnerId: "The company a person or address trades under (a company's own id on a company). Rolls contacts up; who OWNS a company is parentCompanyId."
    scopeKey: "Echo of the book scope this customer was fetched under."
  virtualJoins:
    - { anchorLabel: OdooBook, relationship: HAS_CUSTOMER, keyField: scope,
        recordKeyField: scopeKey, producer: customersAll, maxFanoutTotal: 50000,
        description: "Every partner we have sold to or invoiced (customer_rank > 0) — mostly companies, and any person invoiced directly. How many is one search_count, filters and all." }
    # Prospects too. HAS_CUSTOMER is who has BOUGHT; an account-level question is as often about
    # a company sales is still courting, and it has to be an account before anything can be
    # said about it.
    # implicitDoor: a bare `MATCH (k:CrmAccount)` takes THIS door. Odoo has three book doors onto
    # partners, and the engine will not choose between them; the vocabulary's CrmAccount is "a
    # company as the CRM knows it", prospects included, which is this one.
    - { anchorLabel: OdooBook, relationship: HAS_COMPANY, keyField: scope,
        recordKeyField: scopeKey, producer: companiesAll, maxFanoutTotal: 50000, implicitDoor: true,
        description: "Every company the CRM knows — customers and prospects alike. The door for ONE company: `WHERE c.name = $name` or `c.id = $id` is one call; how many is one search_count." }
    # BOTH SIDES. HAS_CUSTOMER and HAS_COMPANY each reach companies only; this reaches the
    # PEOPLE too, which is what a question about notes needs — most chatter is written on a
    # contact, not on the company record. Split them afterwards on `is_company`, a boolean:
    # `c.is_company = true`. It was once described as the string 'true', and a records read
    # compared that way matched nothing while Odoo's count, given the same filter, matched every
    # company.
    - { anchorLabel: OdooBook, relationship: HAS_PARTNER, keyField: scope,
        recordKeyField: scopeKey, producer: partnersAll, maxFanoutTotal: 50000,
        description: "Every partner in the book — companies AND the people at them. The door for a question that must not stop at company records; how many is one search_count." }
    # Per-element join over the meeting's attendee LIST — one meeting fans out to each
    # attendee partner, so "who am I meeting and what do they owe us" is one traversal.
    - { anchorLabel: OdooMeeting, relationship: MEETING_WITH, keyField: partner_ids,
        recordKeyField: id, producer: customersById,
        description: "The partners attending this meeting — companies and people." }
    - { anchorLabel: OdooLead, relationship: LEAD_OF, keyField: partner_id, recordKeyField: id,
        producer: customersById, description: "The customer a deal is with: its partner, usually the company. One batched call for any number of deals." }
    # From an invoice to whoever it is made out to. One batched call for any number of invoices,
    # so "the 10 biggest unpaid invoices and who owes them" reads 10 partners, not the book's.
    - { anchorLabel: OdooInvoice, relationship: INVOICE_OF, keyField: partner_id, recordKeyField: id,
        producer: customersById, description: "The partner an invoice is made out to — usually the company, sometimes a person there." }
    # The vocabulary's FollowUp edge. Keyed on `partnerId`, which is the activity's res_id ONLY when
    # it hangs on a partner: res_id alone is an id in whatever model res_model names, and keyed on
    # it a follow-up on deal 12242 would be read as one on partner 12242.
    - { anchorLabel: OdooActivity, relationship: FOLLOW_UP_ON, keyField: partnerId, recordKeyField: id,
        producer: customersById, description: "The company or person a scheduled activity is about." }
    # The vocabulary's own edge, from the vocabulary's own anchor. Odoo is asked for the
    # account's domain with `website ilike`, a SUBSTRING match, and recordKeyField is `website`
    # and NOT an echo of the asked key: read through the spine, `https://www.stark.com` is
    # stark.com and `https://notstark.com` is not, so a stray is left unlinked.
    # ridesHub: when a query has already swept the book's COMPANIES — `MATCH (k:CrmAccount)`, which
    # takes the HAS_COMPANY door — this edge is answered from those companies by the account's domain,
    # the spine's own key, instead of one fetch per account, which is refused above 200 accounts
    # (embabel/me#1489). The ride trusts the sweep to be complete, and only HAS_COMPANY is: this edge
    # reaches prospects too (is_company, any customer_rank), and a query that swept HAS_CUSTOMER instead
    # rides only the companies that have bought — a prospect billing knows then reads as "unknown to
    # the CRM". realm-account-health's billed-but-unknown rule said six where Odoo holds three.
    - { anchorLabel: CustomerAccount, relationship: TRACKED_AS, keyField: accountKey,
        recordKeyField: website, producer: customersByWebsite, ridesHub: true,
        description: "Odoo's record of a customer account, matched on the company's website." }
    # THE COMPANY HIERARCHY, the vocabulary's two edges between CrmAccounts. Up is one parent per
    # hop and keys on parentCompanyId, which only a company carries (see producers: THE COMPANY
    # HIERARCHY), so `-[:SUBSIDIARY_OF*1..4]->` walks to the top and never from a person to their
    # employer. Down fans out, and is named apart rather than written as `<-[:SUBSIDIARY_OF]-`:
    # a walk up then never asks, at each hop, for every sibling of the company it passed.
    # commercial_partner_id is not followed here: on a company it is the company itself.
    - { anchorLabel: OdooCustomer, relationship: SUBSIDIARY_OF, keyField: parentCompanyId,
        recordKeyField: id, producer: customersById,
        description: "The company this one belongs to — its parent company in Odoo. None when it has no parent. `-[:SUBSIDIARY_OF*1..4]->` walks to the top of the group, one call per level." }
    - { anchorLabel: OdooCustomer, relationship: HAS_SUBSIDIARY, keyField: id,
        recordKeyField: parentCompanyId, producer: subsidiariesByParent,
        description: "The companies Odoo files under this one as their parent — its direct subsidiaries. `-[:HAS_SUBSIDIARY*1..4]->` reaches the whole group below it, one call per level." }

- name: OdooInvoice
  visibility: internal
  description: >-
    One posted Odoo customer invoice (account.move, out_invoice), identified by `id`, not yet
    fully paid: payment_state 'not_paid' or 'partial'. amount_residual is what is still owed,
    amount_total the total, both in `currency` (ISO code), major units. invoice_date_due is the BUSINESS due date
    ('YYYY-MM-DD'); overdue means due before today. Drafts, cancelled and paid invoices and credit
    notes are not here. Doors: HAS_UNPAID_INVOICE from OdooBook (all, largest debt first) or from
    a customer; INVOICE_OF to the partner it is made out to. Filters on partner_id, amounts, dates,
    payment_state and currency are applied by Odoo. Example — overdue by more than 30 days:
    MATCH (b:OdooBook)-[:HAS_UNPAID_INVOICE]->(i) WHERE i.invoice_date_due < '2026-10-25'
    RETURN i.name, i.amount_residual, i.currency.
  properties:
    id: { description: "Odoo account.move id. Write it quoted ('512').", metadata: { identity: "true" } }
    name: "Invoice number ('INV/2026/00042'). Odoo's demo data repeats some numbers; join on id, never on this."
    partner_id: "The partner the invoice is made out to (bare id) — usually the company, sometimes a person there. INVOICE_OF reaches it."
    amount_total: { type: float, currency: currency, description: "Invoice total, tax included, major units." }
    amount_residual: { type: float, currency: currency, description: "What is still owed on it, major units. Equals amount_total when nothing has been paid." }
    currency: "ISO 4217 code of the invoice's currency ('USD'). Sum amounts only within one currency."
    currency_id: "Currency id (bare). Its code is `currency`."
    invoice_date: { format: yyyy-MM-dd, description: "BUSINESS date the invoice was issued." }
    invoice_date_due: { format: yyyy-MM-dd, description: "BUSINESS date payment is due. Overdue is `i.invoice_date_due < '<today>'`, applied by Odoo." }
    payment_state: "'not_paid' (nothing received) or 'partial' (part received). Paid invoices are not reachable here."
    sourceUrl: "Opens this invoice in Odoo."
    partnerKey: "The partner id this invoice is attributed to — the same as partner_id."
    scopeKey: "Echo of the book scope this invoice was fetched under."
  virtualJoins:
    - { anchorLabel: OdooBook, relationship: HAS_UNPAID_INVOICE, keyField: scope,
        recordKeyField: scopeKey, producer: invoicesUnpaidAll, maxFanoutTotal: 50000,
        description: "Every posted, unpaid customer invoice on the book, largest amount still owed first — so a top-N by amount_residual reads one page." }
    # materializedKeyField: once the book's unpaid invoices are swept (HAS_UNPAID_INVOICE from
    # OdooBook), a customer's are the swept invoices whose partner_id is its id — no fetch per
    # customer, which is refused above maxAnchors on a book of thousands (embabel/me#1489).
    - { anchorLabel: OdooCustomer, relationship: HAS_UNPAID_INVOICE, keyField: id,
        recordKeyField: partnerKey, producer: unpaidInvoicesByPartner, materializedKeyField: partner_id,
        description: "This customer's posted invoices not fully paid. One call for any number of customers." }
    # Same records, anchored one hop EARLIER: lead and invoice both carry partner_id, so the
    # pipeline question reaches invoices at depth 2 (a branch off the lead) instead of a
    # depth-3 chain — which the engine currently loses silently (platform issue; see realm
    # notes). Same producer, same filter, stated twice on purpose.
    - { anchorLabel: OdooLead, relationship: CUSTOMER_OWES, keyField: partner_id,
        recordKeyField: partnerKey, producer: unpaidInvoicesByPartner,
        description: "Unpaid invoices of the customer this deal is with." }

- name: OdooOrder
  visibility: internal
  description: >-
    One Odoo sales order or quotation (sale.order), identified by `id`. state: 'draft'
    (quotation), 'sent' (quotation sent), 'sale' (confirmed), 'done' (locked), 'cancel'. amount_total is in `currency`,
    major units. date_order is the order date (UTC). Reached from a customer by HAS_ORDER, any
    state; filter on state, amount_total and date_order is applied by Odoo.
  properties:
    id: { description: "Odoo sale.order id.", metadata: { identity: "true" } }
    name: "Order reference ('S00042')."
    partner_id: "Customer id (bare)."
    amount_total: { type: float, currency: currency, description: "Order total, tax included, major units." }
    currency: "ISO 4217 code of the order's currency."
    state: "'draft' or 'sent' (still a quotation), 'sale' (confirmed), 'done' (locked), 'cancel' (cancelled)."
    date_order: { format: "yyyy-MM-dd HH:mm:ss, UTC", description: "Order date: the quotation date until confirmed, then the confirmation date." }
    sourceUrl: "Opens this order in Odoo."
    partnerKey: "The partner id this order is attributed to — the same as partner_id."
  virtualJoins:
    - { anchorLabel: OdooCustomer, relationship: HAS_ORDER, keyField: id,
        recordKeyField: partnerKey, producer: ordersByPartner,
        description: "This customer's sales orders and quotations, any state, newest first. One call for any number of customers." }

- name: OdooBook
  visibility: internal
  description: >-
    The whole Odoo book, pinned by the LITERAL scope 'all' — write MATCH (b:OdooBook
    {scope:'all'}) (or bare: it defaults) and traverse. The door for questions about the SETS:
    HAS_CUSTOMER, HAS_COMPANY, HAS_PARTNER, HAS_OPEN_LEAD, HAS_ANY_LEAD, HAS_DECIDED_LEAD,
    HAS_UNPAID_INVOICE, HAS_MEETING, HAS_ACTIVITY, HAS_MESSAGE. It is not stored and does not need
    to exist.
  properties:
    scope: { description: "Always 'all'.", metadata: { identity: "true", default: "all" } }

- name: OdooContact
  visibility: internal
  userAnchor: false
  parents: [AccountContact]
  description: >-
    One PERSON at a customer company, identified by `id` (an Odoo res.partner with is_company
    false, filed under the company by parent_id) — the business vocabulary's AccountContact.
    email is lower-cased: that is how a contact is recognised as a support requester. Reached from a
    company by HAS_ACCOUNT_CONTACT; subsidiaries are never returned here (they are
    HAS_SUBSIDIARY). Archived people are not reached.
  properties:
    id: { identity: true, description: "Odoo partner id." }
    name: "Full name."
    email: { joinKey: "email", description: "Email address, LOWER CASE — the key a support requester is matched on. `ct.email = $email` is asked of Odoo ignoring case." }
    function: "Job title, as typed in Odoo."
    jobTitle: "Job title (the vocabulary's name for `function`)."
    phone: "Phone number, as typed in Odoo (no normalised format)."
    parent_id: "The company's partner id."
    sourceUrl: "Opens this person in Odoo."
  virtualJoins:
    - { anchorLabel: OdooCustomer, relationship: HAS_ACCOUNT_CONTACT, keyField: id,
        recordKeyField: parent_id, producer: contactsByCompany,
        description: "The people Odoo files under this company — never its subsidiaries. One call for any number of companies." }

# A chatter message. Body arrives as HTML, as Odoo stores it — a consumer doing judgment
# (sentiment, classification) should strip tags first, not ask the model to.
- name: OdooMessage
  userAnchor: false
  # An AccountNote of the business vocabulary: what our own people wrote down, wherever in
  # Odoo they wrote it — on the company, on a person there, or on a deal. What the CRM
  # BELIEVES lives in these, which is why "is this problem mentioned anywhere?" reads them.
  parents: [AccountNote]
  description: >-
    One note or email in Odoo's chatter (mail.message), identified by `id`, written on a deal
    (model 'crm.lead') or on a company or person ('res.partner'); tracking entries like "Stage
    changed" are excluded. body is HTML as Odoo stores it. date is the SYSTEM clock, UTC; writtenOn its
    day. Doors: HAS_MESSAGE/HAS_NOTE from a deal, HAS_NOTE from a company or contact, and
    HAS_MESSAGE/HAS_NOTE from OdooBook for the whole book (pick a side with `n.model`). Filters on
    model, res_id, message_type, author and the dates are applied by Odoo, newest first.
  properties:
    id:
      identity: true
      description: "Odoo mail.message id."
    body: "Message body, as HTML. Strip tags before judging it."
    date: { format: "yyyy-MM-dd HH:mm:ss, UTC", description: "SYSTEM clock: when it was posted. A back-dated import carries the date it was written." }
    writtenOn: { format: yyyy-MM-dd, description: "The UTC day it was posted (the vocabulary's AccountNote.writtenOn)." }
    subject: "Subject, when the message was an email."
    message_type: "'comment' (an internal note or a logged message) or 'email'."
    res_id: "The id of the record it was written on — in the model `model` names."
    author_id: "The author's partner id (bare). Their NAME is `authorName`."
    authorName: "Who wrote it, by name."
    author: "Who wrote it, by name (the vocabulary's AccountNote.author)."
    about: "'opportunity' when the note is on a deal. Set on a deal's own thread only."
    sourceUrl: "Opens the record the note is on."
    leadKey: "The deal this message is on: its res_id when it is a crm.lead message."
    partnerKey: "The company or contact this message is on: its res_id when it is a res.partner message."
    # WHICH KIND of record `res_id` points at — `res.partner` (a company or a contact) or
    # `crm.lead` (a deal). Without it a note on a deal and a note on a company are
    # indistinguishable once fetched.
    model: "The Odoo model `res_id` refers to: 'res.partner' (a company or person) or 'crm.lead' (a deal)."
    scopeKey: "Echo of the book scope this message was fetched under."
  virtualJoins:
    # THE BOOK'S WHOLE CHATTER, one sweep. The anchored joins below ask per record, which is right
    # for one account and refuses across the book; a query that ALSO sweeps `MATCH (n:AccountNote)`
    # has them ride this sweep instead, matched on leadKey / partnerKey (materializedKeyField).
    # A reader takes the side it wants with `WHERE n.model = 'res.partner' | 'crm.lead'` and
    # joins `n.res_id` to the customer or lead sweep graph-side, which costs nothing.
    - { anchorLabel: OdooBook, relationship: HAS_MESSAGE, keyField: scope,
        recordKeyField: scopeKey, producer: messagesAll, maxFanoutTotal: 50000,
        description: "Every note and email in the book's chatter, on companies, contacts and deals alike, newest first — the door for notes questions asked across accounts rather than about one." }
    # implicitDoor: a bare `MATCH (n:AccountNote)` takes this door. HAS_MESSAGE is the same sweep,
    # and two doors onto one population would otherwise leave the engine refusing to pick.
    - { anchorLabel: OdooBook, relationship: HAS_NOTE, keyField: scope,
        recordKeyField: scopeKey, producer: messagesAll, maxFanoutTotal: 50000, implicitDoor: true,
        description: "The same sweep, by the business vocabulary's name for it." }
    - { anchorLabel: OdooLead, relationship: HAS_MESSAGE, keyField: id, recordKeyField: leadKey,
        producer: messagesByLead, materializedKeyField: leadKey,
        description: "The deal's chatter thread, newest first — recent interactions on the deal. One call for any number of deals." }
    - { anchorLabel: OdooLead, relationship: HAS_NOTE, keyField: id, recordKeyField: leadKey,
        producer: messagesByLead, materializedKeyField: leadKey,
        description: "What was written on the deal (the same thread, by the vocabulary's name)." }
    - { anchorLabel: OdooCustomer, relationship: HAS_NOTE, keyField: id, recordKeyField: res_id,
        producer: messagesByPartner, materializedKeyField: partnerKey,
        description: "What was written on the company's own record (not on the people there, nor its deals)." }
    - { anchorLabel: OdooContact, relationship: HAS_NOTE, keyField: id, recordKeyField: res_id,
        producer: messagesByPartner, materializedKeyField: partnerKey,
        description: "What was written on a contact's record." }

# A calendar meeting. The preparation anchor: walk MEETING_WITH to the attendee partners and
# from them to everything else the book knows — debt, deals, chatter, firmographics, news.
- name: OdooMeeting
  userAnchor: false
  # A Meeting of the business vocabulary; MEETING_WITH (declared on OdooCustomer) is its edge.
  parents: [Meeting]
  description: >-
    One meeting in the Odoo calendar (calendar.event), identified by `id`, with its attendee
    partner ids. start and stop are UTC, 'YYYY-MM-DD HH:MM:SS' — convert before calling one "this afternoon"; for an
    all-day event read only the day (startsOn). Reached by HAS_MEETING from OdooBook, earliest
    first; MEETING_WITH reaches the attendees. A window on start or startsOn is applied by Odoo:
    WHERE m.start >= '2026-11-24'.
  properties:
    id:
      identity: true
      description: "Odoo calendar.event id."
    name: "Meeting subject."
    title: "Meeting subject (the vocabulary's name)."
    start: { format: "yyyy-MM-dd HH:mm:ss, UTC", description: "When the meeting starts, UTC. On an all-day event the time carries no meaning." }
    stop: { format: "yyyy-MM-dd HH:mm:ss, UTC", description: "When the meeting ends, UTC." }
    startsOn: { format: yyyy-MM-dd, description: "The UTC day it starts." }
    allday: "True for an all-day event, whose start and stop carry no meaningful time."
    location: "Location, when set."
    description: "Agenda / notes, when set (HTML)."
    user_id: "The organiser's Odoo user id."
    sourceUrl: "Opens this meeting in Odoo's calendar."
    partner_ids: { cardinality: LIST, description: "Attendee partner ids — the key MEETING_WITH fans out over." }
  virtualJoins:
    - { anchorLabel: OdooBook, relationship: HAS_MEETING, keyField: scope,
        recordKeyField: scopeKey, producer: meetingsAll, maxFanoutTotal: 50000,
        description: "Every calendar meeting in the book, earliest first." }

# A scheduled next action (mail.activity): the to-do Odoo attaches to a record. res_model +
# res_id say what it hangs on; deadlines make "what needs doing" a date filter, not a guess.
- name: OdooActivity
  userAnchor: false
  # A FollowUp of the business vocabulary; FOLLOW_UP_ON (declared on OdooCustomer) is its edge.
  parents: [FollowUp]
  description: >-
    One scheduled Odoo activity (mail.activity), identified by `id` — a call, an email, a
    to-do — due on a BUSINESS date, hanging on one record: res_model says which kind ('crm.lead', 'res.partner', …), res_id which
    one. Done activities leave Odoo, so everything here is still to do; overdue is
    `a.date_deadline < '<today>'`. Reached by HAS_ACTIVITY from OdooBook, soonest first;
    FOLLOW_UP_ON reaches the partner when it hangs on one. Filters on res_model, res_id, owner and
    date_deadline are applied by Odoo.
  properties:
    id:
      identity: true
      description: "Odoo mail.activity id."
    summary: "What the activity is, when the author wrote one."
    title: "What is to be done: the summary, or the record's name when there is none."
    kind: "The activity type, as Odoo names it ('To-Do', 'Call', 'Email')."
    res_model: "Model of the record it hangs on: 'crm.lead' (a deal), 'res.partner' (a company or person), …"
    res_id: "Id of that record, in the model res_model names."
    partnerId: "res_id when the activity hangs on a partner (res.partner); null on a deal or anything else."
    res_name: "Display name of that record."
    date_deadline: { format: yyyy-MM-dd, description: "BUSINESS date it is due." }
    dueOn: { format: yyyy-MM-dd, description: "The day it is due (the vocabulary's name for date_deadline)." }
    user_id: "The assignee's Odoo user id. Their NAME is `ownerName`."
    ownerName: "Who on our side is to do it, by name."
    sourceUrl: "Opens the record it hangs on, in Odoo."
  virtualJoins:
    - { anchorLabel: OdooBook, relationship: HAS_ACTIVITY, keyField: scope,
        recordKeyField: scopeKey, producer: activitiesAll, maxFanoutTotal: 50000,
        description: "Every scheduled activity in the book, soonest due first." }
