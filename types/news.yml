# The news bridge — live headlines about the companies in the book, through realm-research's
# Brave-backed NewsItem. Same accumulate pattern as types/diffbot.yml: this file contributes
# an edge into a type another realm owns, and records a loading problem (harmlessly) when
# realm-research is not installed.
#
# The key is the customer NAME, sent to Brave as the query — strong for a real company,
# garbage for a fictional one ("Acme Corporation" returns somebody's headlines). The join
# cannot know which is which, so the CURATED views gate through the Diffbot hop: a customer
# that resolves in the knowledge graph is real, and only real customers get news attributed.
# Generated cypher that skips the gate gets what it asked for.

- name: NewsItem
  userAnchor: false
  virtualJoins:
    - anchorLabel: OdooCustomer
      relationship: HAS_NEWS
      keyField: name
      recordKeyField: topicName
      producer: newsByTopic
      maxAnchors: 25
      description: "Recent news mentioning this customer, searched by company name. Names are weak evidence — prefer views that gate on the Diffbot hop."
