# Views over the Diffbot bridge (types/diffbot.yml) — the customer book joined to the real
# companies behind its domains. The pure joins here need realm-diffbot installed and a
# DIFFBOT_TOKEN; without them they load but return nothing, and the Odoo-only views are
# untouched. The two AI views (OdooMeetingBriefing, OdooDealTriage) reach Diffbot through
# OPTIONAL hops: they still answer without it, and say what they could not resolve.
#
# nbEmployees materializes as a STRING on the virtual node, so anything numeric about it
# goes through toInteger() — sorting the raw property would be lexical and wrong.

- name: OdooCustomerFirmographics
  description: |
    Who our customers really are: every customer whose website resolves in the Diffbot
    Knowledge Graph, with headcount, industries and ultimate owner. Answers "how big are
    our customers", "which of our customers is the biggest company", "what industries do we
    sell into", "enrich our customer book". A customer missing here has an unresolvable (or
    unset) website — absence is the honest answer, not a failure.
  outputLabel: Customer firmographics
  cypher: |
    MATCH (b:OdooBook)-[:HAS_CUSTOMER]->(c:OdooCustomer)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)
    RETURN c.id AS customerId, c.name AS customer, c.website AS website,
           toInteger(d.nbEmployees) AS headcount, d.industries AS industries,
           d.ultimateParentName AS ultimateOwner, d.diffbotUri AS diffbotUri
    ORDER BY headcount DESC

- name: OdooDebtorOwnership
  description: |
    Which of our debtors belong to a larger corporate group, and who ultimately owns them —
    debtors whose Diffbot record names an ultimate parent OTHER than themselves, with what
    they owe. Answers "who ultimately owns our debtors", "which customers are subsidiaries",
    "what corporate groups are we exposed to". The exposure question: an invoice to a
    subsidiary is exposure to the parent.
  outputLabel: Debtor ownership
  cypher: |
    MATCH (b:OdooBook)-[:HAS_CUSTOMER]->(c:OdooCustomer)-[:HAS_UNPAID_INVOICE]->(i:OdooInvoice)
    WITH c, sum(i.amount_residual) AS totalOwed
    MATCH (c)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)
    WHERE d.ultimateParentName IS NOT NULL AND d.ultimateParentName <> d.name
    RETURN c.id AS customerId, c.name AS debtor, totalOwed,
           d.ultimateParentName AS ultimateOwner, toInteger(d.nbEmployees) AS employees
    ORDER BY totalOwed DESC

- name: OdooDebtorNews
  description: |
    What is happening to the companies that owe us money: every Diffbot-resolved debtor with
    what they owe and the last month's headlines about them. Answers "news about our
    debtors", "what's happening to our biggest debtor", "any risk signals on our
    receivables". Gated through the Diffbot hop so a fictional customer's name never
    attracts a real company's headlines.
  outputLabel: Debtor news
  cypher: |
    MATCH (b:OdooBook)-[:HAS_CUSTOMER]->(c:OdooCustomer)-[:HAS_UNPAID_INVOICE]->(i:OdooInvoice)
    WITH c, sum(i.amount_residual) AS totalOwed
    MATCH (c)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)
    MATCH (c)-[:HAS_NEWS]->(n:NewsItem)
    RETURN c.id AS customerId, c.name AS debtor, totalOwed,
           n.title AS headline, n.age AS age, n.url AS url
    ORDER BY totalOwed DESC

- name: OdooMeetingBriefing
  description: |
    Meeting preparation: for each upcoming calendar meeting, who you are meeting, what they
    owe (exact), the open deals with win odds and how their chatter threads read, who
    ultimately owns them, recent news — and a composed 4-6 sentence briefing. Answers "prep
    me for my meeting with X", "brief me on my upcoming meetings", "what do I need to know
    before my meetings". The customer parameter narrows to one counterparty by name.
  outputLabel: Meeting briefing
  params:
    customer:
      type: string
      default: ""
      description: "Only meetings whose counterparty name contains this (case-insensitive). Empty = all upcoming."
  # The figures (owed, unpaidInvoices) are computed by the query and travel BESIDE the prose;
  # the harness reconciles them to the cent. synthesize() composes the briefing from the
  # assembled fact text only. News is attributed only through the Diffbot hop — a fictional
  # customer's name must not attract a real company's headlines. (This view's shape found a
  # real engine defect: the final-anchor cut probed with an alias earlier WITH stages had
  # consumed, poisoning the transaction — fixed and pinned in FinalAnchorCutTest.)
  cypher: |
    MATCH (b:OdooBook)-[:HAS_MEETING]->(m:OdooMeeting)-[:MEETING_WITH]->(c:OdooCustomer)
    WHERE m.start >= toString(date()) AND toLower(c.name) CONTAINS toLower($customer)
    OPTIONAL MATCH (c)-[:HAS_UNPAID_INVOICE]->(i:OdooInvoice)
    WITH b, m, c, count(DISTINCT i) AS unpaid, coalesce(sum(i.amount_residual),0) AS owed
    OPTIONAL MATCH (b)-[:HAS_OPEN_LEAD]->(l:OdooLead)-[:LEAD_OF]->(c)
    OPTIONAL MATCH (l)-[:HAS_MESSAGE]->(msg:OdooMessage)
    WITH m, c, unpaid, owed, l, collect(DISTINCT msg.body) AS bodies
    WITH m, c, unpaid, owed,
         collect(DISTINCT CASE WHEN l IS NULL THEN NULL ELSE
           'open deal "' + l.name + '": $' + coalesce(toString(l.expected_revenue),'?') +
           ' at ' + coalesce(toString(l.probability),'?') + '% win probability' +
           CASE WHEN size(bodies) > 0
                THEN ' -- thread: ' + reduce(s = '', x IN bodies[0..4] | s + ' | ' + coalesce(x,''))
                ELSE ' -- no recent thread' END
         END) AS dealFacts
    OPTIONAL MATCH (c)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)
    OPTIONAL MATCH (c)-[:HAS_NEWS]->(n:NewsItem)
    WITH m, c, unpaid, owed, dealFacts, d,
         collect(DISTINCT CASE WHEN d IS NULL THEN NULL ELSE n.title END)[0..3] AS headlines
    WITH m, c, unpaid, owed,
         'Meeting: ' + m.name + ' on ' + m.start + ' with ' + c.name + '. ' +
         CASE WHEN owed > 0 THEN 'They owe us $' + toString(owed) + ' across ' + toString(unpaid) + ' unpaid invoice(s). '
              ELSE 'They have no unpaid invoices. ' END +
         CASE WHEN size(dealFacts) = 0 THEN 'No open deals. ' ELSE reduce(s = '', f IN dealFacts | s + f + ' ') END +
         CASE WHEN d IS NULL THEN 'No firmographics resolved for this customer. '
              ELSE 'Company: ' + coalesce(toString(d.nbEmployees),'?') + ' employees' +
                   coalesce(', ultimately owned by ' + d.ultimateParentName, '') + '. ' END +
         CASE WHEN size(headlines) = 0 THEN 'No recent news found.'
              ELSE 'Recent news: ' + reduce(s = '', h IN headlines | s + coalesce(h,'') + '; ') END
         AS factText
    RETURN m.id AS meetingId, m.name AS meeting, m.start AS starts,
           c.id AS customerId, c.name AS customer, owed, unpaid AS unpaidInvoices,
           synthesize(factText, 'a meeting briefing for the salesperson attending: 4-6 sentences of plain prose, using ONLY these facts, never inventing or softening; if news is present mention the most relevant item; end with the one thing to raise') AS briefing
    ORDER BY starts

- name: OdooDealTriage
  description: |
    Classify every open opportunity — strategic / standard / at_risk — and read the sentiment
    of its recent interactions from the chatter thread. Answers "which deals are in trouble",
    "which deals are at risk", "how do our opportunities feel", "triage the pipeline",
    "understand our recent interactions", "which opportunities need attention". Sentiment is
    null for a deal nobody has written on: silence is not neutral, it is unknown.
  outputLabel: Deal triage
  params:
    triage:
      type: string
      default: ""
      description: "Only deals judged this way: strategic, standard or at_risk. Empty = every open deal."
  # The lens this replaces (lenses/deal-triage.yml) composed three queries and two
  # gateway.ai.classify calls in script; the engine's classify() aggregation now carries the
  # same judgments in-query, the rubric travelling as its third argument. The figures
  # (revenue, probability, headcount) are computed by the query and travel BESIDE the labels;
  # the labels are the only model-made cells. Triage is judged in a WITH so the query can
  # FILTER on it (the filterable-aggregation lane stamps it before the query runs) — that is
  # what lets the selector bind "which deals are at risk" as triage='at_risk'. It judges a
  # per-deal digest that includes the thread itself, so the judge reads the interactions
  # directly rather than a precomputed mood; sentiment reduces the same thread in RETURN.
  # Chatter arrives as Odoo's HTML — the judge is instructed to read meaning, and tags are
  # noise it tolerates (same stance as the briefing).
  cypher: |
    MATCH (b:OdooBook)-[:HAS_OPEN_LEAD]->(l:OdooLead)-[:LEAD_OF]->(c:OdooCustomer)
    OPTIONAL MATCH (l)-[:HAS_MESSAGE]->(msg:OdooMessage)
    WITH l, c, collect(DISTINCT msg.body) AS bodies
    OPTIONAL MATCH (c)-[:HAS_DIFFBOT_ORG]->(d:DiffbotOrganization)
    WITH l, c, bodies, d,
         CASE WHEN size(bodies) = 0 THEN ''
              ELSE reduce(s = '', x IN bodies[0..6] | s + ' | ' + coalesce(x,'')) END AS thread
    WITH l, c, d, thread,
         classify(l.name + ' — ' + c.name +
           CASE WHEN d IS NULL THEN ''
                ELSE ' (' + coalesce(toString(d.nbEmployees),'?') + ' employees)' END +
           ', $' + coalesce(toString(l.expected_revenue),'?') +
           ' at ' + coalesce(toString(l.probability),'?') + '% win probability' +
           CASE WHEN thread = '' THEN ' | no recent interactions'
                ELSE ' | thread: ' + thread END,
           'strategic,standard,at_risk',
           'One open sales opportunity. strategic: large value or a major company, worth leadership attention. at_risk: the interactions or odds say it is stalling or souring, whatever its size. standard: everything else.') AS triage
    WHERE $triage = '' OR triage = $triage
    RETURN l.id AS leadId, l.name AS deal, c.id AS customerId, c.name AS customer,
           l.expected_revenue AS revenue, l.probability AS probability,
           toInteger(d.nbEmployees) AS headcount,
           classify(thread, 'positive,neutral,negative',
             'Each item is the recent chatter on one sales opportunity. Judge the current disposition of the customer toward the deal from what was actually written.') AS sentiment,
           triage
    ORDER BY revenue DESC
